<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico Studio</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #1d2330; --muted: #667085;
  --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f9d55; --warn: #c27c0e; --err: #d64545;
  --code-bg: #fbfbfc; --console-bg: #11151c; --console-text: #d7dde8; --sys: #7aa2f7; --gutter: #98a2b3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --border: #2c3340; --text: #e3e7ee; --muted: #8b95a7;
    --accent: #5b8def; --accent-text: #ffffff; --ok: #3ccf7a; --warn: #e3a33b; --err: #f06a6a;
    --code-bg: #151920; --console-bg: #0c0f14; --console-text: #d7dde8; --sys: #7aa2f7; --gutter: #5b6578;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, "Noto Sans JP", sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
select, input[type=text] { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--err); }
main { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 1fr 1fr;
  grid-template-areas: "side code" "side console"; gap: 12px; padding: 12px 16px;
  height: calc(100vh - 56px); min-height: 520px; }
.side { grid-area: side; } .code-panel { grid-area: code; } .console-panel { grid-area: console; }
/* .panel の display: flex に負けないよう、main を付けて優先度を上げる */
main .guide-panel { grid-area: guide; display: none; }
/* --guide-w は仕切りのドラッグで変わる。280px と 564px は JS の GUIDE_MIN / RIGHT_MIN と同じ値にする */
main.with-guide { grid-template-columns: clamp(280px, var(--guide-w, 40%), calc(100% - 564px)) 240px minmax(0, 1fr);
  grid-template-rows: 1fr 1fr; grid-template-areas: "guide side code" "guide side console"; }
main.with-guide .guide-panel { display: flex; }
/* ガイドと同じマスに置き、右の余白（gap）へはみ出させて仕切りにする */
.splitter { grid-area: guide; display: none; justify-self: end; width: 12px; margin-right: -12px;
  position: relative; z-index: 1; cursor: col-resize; touch-action: none; outline: 0; }
main.with-guide .splitter { display: block; }
.splitter::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 48px;
  transform: translate(-50%, -50%); border-radius: 2px; background: var(--border); }
.splitter:hover::after, .splitter:focus-visible::after, body.resizing .splitter::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
header .spacer { flex: 1; }
#guideBtn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel h2 { font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; }
.panel h2 .grow { flex: 1; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.checks { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 8px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks li .dot { margin-top: 6px; flex: none; }
.checks small { color: var(--muted); display: block; }
.hint { margin: 0 12px 12px; padding: 8px 10px; border-radius: 6px; background: var(--bg);
  color: var(--muted); font-size: 12px; }
.hint:empty { display: none; }
.hint button { margin-top: 6px; }
.files { list-style: none; margin: 0; padding: 4px 0; overflow: auto; flex: 1; }
.files li { display: flex; align-items: center; gap: 6px; padding: 3px 12px; }
.files li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.files li .name:hover { color: var(--accent); }
.files li small { color: var(--muted); }
.files li button { padding: 0 6px; font-size: 12px; }
.empty { color: var(--muted); padding: 8px 12px; font-size: 12px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; }
.toolbar .grow { flex: 1; }
.editor { position: relative; flex: 1; display: flex; min-height: 0; background: var(--code-bg); }
.gutter { padding: 10px 8px 10px 10px; text-align: right; color: var(--gutter); user-select: none;
  font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", monospace; overflow: hidden; white-space: pre; }
textarea#code { flex: 1; border: 0; outline: 0; resize: none; padding: 10px; background: transparent;
  color: var(--text); font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", monospace; tab-size: 4;
  white-space: pre; overflow: auto; }
#console { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; background: var(--console-bg);
  color: var(--console-text); font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
  white-space: pre-wrap; word-break: break-all; }
#console .err { color: #ff8b8b; } #console .sys { color: var(--sys); }
.inputrow { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); }
.inputrow input { flex: 1; font-family: ui-monospace, monospace; }
.kbd { color: var(--muted); font-size: 12px; }
#toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px;
  border-radius: 8px; background: var(--err); color: #fff; display: none; white-space: pre-wrap; }
#toast.ok { background: var(--ok); }
/* ---------- 関数・引数の説明（クリックで表示） ---------- */
#tip { position: fixed; z-index: 10; max-width: min(380px, calc(100vw - 32px)); padding: 10px 12px;
  background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .25); font-size: 13px; line-height: 1.6; display: none; }
#tip .tip-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
#tip .tip-key { font: 600 13px ui-monospace, "DejaVu Sans Mono", monospace; color: var(--accent); }
#tip .tip-kind { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
#tip .tip-text { white-space: pre-line; }
#tip details { margin-top: 6px; font-size: 12px; color: var(--muted); }
#tip summary { cursor: pointer; width: fit-content; }
#tip details div { margin-top: 2px; }
/* ---------- ガイド ---------- */
.guide-head { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.guide-panel { position: relative; }
#guideToc { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; }
#guideToc .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#tocPanel { position: absolute; top: 50px; left: 12px; right: 12px; max-height: calc(100% - 62px); overflow: auto; z-index: 5;
  padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
#tocPanel[hidden] { display: none; }
#tocPanel button { border: 0; background: none; border-radius: 4px; padding: 5px 8px; text-align: left; white-space: normal; }
#tocPanel button:hover { background: var(--bg); }
.toc-row { display: flex; align-items: center; }
.toc-row .toc-go { flex: 1; min-width: 0; font-weight: 600; }
.toc-row.current .toc-go { color: var(--accent); }
#tocPanel .toc-fold { flex: none; width: 28px; padding: 5px 0; text-align: center; color: var(--muted); }
.toc-fold[aria-expanded="true"] { transform: rotate(90deg); }
.toc-sub { list-style: none; margin: 0 0 4px; padding: 0 0 0 28px; }
.toc-sub[hidden] { display: none; }
.toc-sub button { width: 100%; font-size: 13px; color: var(--muted); }
.guide-body { flex: 1; overflow: auto; padding: 4px 20px 24px; line-height: 1.75; }
.guide-body h1 { font-size: 21px; margin: 16px 0 12px; }
.guide-body h2 { font-size: 17px; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.guide-body h3 { font-size: 15px; margin: 20px 0 8px; }
.guide-body p { margin: 8px 0; }
.guide-body ul, .guide-body ol { padding-left: 1.5em; margin: 8px 0; }
.guide-body a { color: var(--accent); }
.guide-body code { font: 12.5px ui-monospace, "DejaVu Sans Mono", monospace; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.guide-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
.guide-body th, .guide-body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
.guide-body th { background: var(--bg); }
.guide-body blockquote { margin: 10px 0; padding: 6px 12px; border-left: 4px solid var(--warn);
  background: var(--bg); border-radius: 0 6px 6px 0; color: var(--text); }
.guide-body hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
.guide-body img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); display: block; margin: 10px 0; }
.guide-body video, .guide-body iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; margin: 10px 0; background: #000; }
.codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.codeblock .cb-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg);
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.codeblock .cb-head .grow { flex: 1; }
.codeblock .cb-head button { padding: 1px 8px; font-size: 12px; }
.codeblock.run .cb-head { color: var(--ok); }
.codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; background: var(--code-bg); }
.codeblock pre code { border: 0; background: none; padding: 0; white-space: pre; }
.guide-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--border); }
.guide-nav button { max-width: 48%; overflow: hidden; text-overflow: ellipsis; }

@media (max-width: 1000px) {
  main, main.with-guide { grid-template-columns: 1fr; grid-template-rows: none; height: auto;
    grid-template-areas: "guide" "side" "code" "console"; }
  main.with-guide .splitter { display: none; }
  .guide-panel { height: 75vh; }
  .editor, #console { min-height: 320px; }
}
</style>
</head>
<body>
<header>
  <h1>Pico Studio</h1>
  <span class="dot" id="connDot"></span><span id="connText">未接続</span>
  <select id="portSel" title="シリアルポート"></select>
  <button id="refreshBtn" title="ポート一覧を更新">更新</button>
  <button id="connectBtn" class="primary">接続</button>
  <button id="disconnectBtn">切断</button>
  <span class="spacer"></span>
  <button id="guideBtn" title="使い方ガイドを横に表示">📘 ガイド</button>
</header>

<main id="main">
  <section class="panel guide-panel">
    <div class="guide-head">
      <button id="guidePrev" title="前の章">◀</button>
      <button id="guideToc" title="章を選ぶ" aria-expanded="false" aria-controls="tocPanel"><span class="title">読み込み中…</span><span aria-hidden="true">▾</span></button>
      <button id="guideNext" title="次の章">▶</button>
      <button id="guideClose" title="ガイドを閉じる">✕</button>
    </div>
    <div id="tocPanel" hidden></div>
    <div class="guide-body" id="guideBody"><p class="empty">読み込み中…</p></div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="ガイドの幅" title="ドラッグで幅を変更（ダブルクリックで元に戻す）"></div>
  <div class="side">
    <section class="panel">
      <h2>接続の確認</h2>
      <ul class="checks">
        <li><span class="dot" id="chkUsb"></span><div>USB で認識<small id="chkUsbText">-</small></div></li>
        <li><span class="dot" id="chkConn"></span><div>シリアル接続<small id="chkConnText">-</small></div></li>
        <li><span class="dot" id="chkMp"></span><div>MicroPython の応答<small id="chkMpText">-</small></div></li>
      </ul>
      <div class="hint" id="hint"></div>
    </section>
    <section class="panel" style="flex:1">
      <h2><span class="grow">ピコのファイル</span><button id="filesBtn" title="一覧を更新">更新</button></h2>
      <ul class="files" id="files"><li class="empty">接続すると表示されます</li></ul>
    </section>
  </div>

  <section class="panel code-panel">
    <h2>コード</h2>
    <div class="toolbar">
      <select id="sampleSel">
        <option value="">サンプルを選ぶ…</option>
      </select>
      <span class="grow"></span>
      <button id="runBtn" class="primary" title="Ctrl+Enter">▶ 実行</button>
      <button id="stopBtn" class="danger">■ 停止</button>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="toolbar">
      <input type="text" id="fileName" value="main.py" size="14" title="ピコに保存するときの名前">
      <button id="saveBtn" title="Ctrl+S">ピコに保存</button>
      <span class="kbd">main.py にすると電源を入れたとき自動で動きます</span>
    </div>
  </section>

  <section class="panel console-panel">
    <h2><span class="grow">出力</span>
      <button id="resetBtn" title="ピコを再起動（main.py が実行される）">リセット</button>
      <button id="clearBtn">クリア</button></h2>
    <pre id="console"></pre>
    <div class="inputrow">
      <input type="text" id="sendInput" placeholder="ピコに送る（REPL のコマンドや input() への入力）" autocomplete="off">
      <button id="sendBtn">送信</button>
    </div>
  </section>
</main>
<div id="toast"></div>
<div id="tip" role="tooltip"></div>

<script>
const $ = (id) => document.getElementById(id);
const SAMPLES = {
  "hello: 文字と計算": `print("hello, pico!")
for i in range(1, 6):
    print(i, "x 2 =", i * 2)
`,
  "LED を点滅させる": `# ボードの LED を点滅させる
# 公式ピコは 25 番ピン。ボードによって番号が違うことがある
from machine import Pin
import time

led = Pin(25, Pin.OUT)
for i in range(10):
    led.toggle()
    time.sleep(0.5)
led.off()
print("おわり")
`,
  "RGB LED を光らせる": `# RGB LED（WS2812）を光らせる
# ピン番号はボードによって違う（例: 23, 16）。光らなければ変えてみる
from machine import Pin
import neopixel, time

np = neopixel.NeoPixel(Pin(23), 1)
for color in [(30, 0, 0), (0, 30, 0), (0, 0, 30), (0, 0, 0)]:
    np[0] = color
    np.write()
    time.sleep(0.5)
`,
  "内蔵の温度センサー": `# RP2040 に入っている温度センサーの値を読む
from machine import ADC
import time

sensor = ADC(4)
for i in range(5):
    v = sensor.read_u16() * 3.3 / 65535
    temp = 27 - (v - 0.706) / 0.001721
    print("温度: {:.1f} ℃".format(temp))
    time.sleep(1)
`,
  "PC と送受信する": `# 下の「送信」欄に数字を入れると、2倍にして返す
# 止めるときは「■ 停止」
while True:
    line = input("数字を入力: ")
    try:
        n = float(line)
        print("受信:", n, "→ 2倍:", n * 2)
    except ValueError:
        print("受信した文字:", line)
`,
};

let state = { connected: false, running: false, last: 0, mpOk: null };
let infoTimer = null;

function toast(msg, ok = false) {
  const t = $("toast");
  t.textContent = msg; t.className = ok ? "ok" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ok ? 2500 : 7000);
}

async function api(path, body, raw) {
  const opt = body === undefined ? {} : {
    method: "POST",
    headers: raw ? { "Content-Type": "application/octet-stream" } : { "Content-Type": "application/json" },
    body: raw ? body : JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "サーバーの応答が読めません" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function setDot(id, cls) { $(id).className = "dot" + (cls ? " " + cls : ""); }

// ---------- ポートと接続確認 ----------
async function refreshPorts() {
  let res;
  try { res = await api("/api/ports"); } catch (e) { return toast(e.message); }
  const sel = $("portSel"), prev = sel.value;
  sel.innerHTML = "";
  for (const p of res.ports) {
    const o = document.createElement("option");
    o.value = p.device;
    o.textContent = p.device + (p.is_pico ? "  (ピコ)" : p.description ? "  " + p.description : "");
    sel.appendChild(o);
  }
  if (!res.ports.length) {
    const o = document.createElement("option"); o.value = ""; o.textContent = "ポートが見つかりません";
    sel.appendChild(o);
  }
  if (state.port && ![...sel.options].some((o) => o.value === state.port)) {
    const o = document.createElement("option"); o.value = o.textContent = state.port; sel.appendChild(o);
  }
  if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
  if (state.port) sel.value = state.port;

  const pico = res.ports.find((p) => p.is_pico);
  const hint = $("hint");
  let html = "";
  if (res.bootsel.detected) {
    setDot("chkUsb", "warn");
    $("chkUsbText").textContent = "BOOTSEL モード（書き込み待ち）";
    html = res.bootsel.mount
      ? `ピコが書き込みモードになっています。MicroPython を書き込むと使えるようになります。<br>
         <button id="flashLatestBtn" class="primary">最新の MicroPython を書き込む</button>
         <button id="flashFileBtn">.uf2 ファイルを選ぶ</button>
         <input type="file" id="uf2File" accept=".uf2" hidden>`
      : "ピコが書き込みモードで見えていますが、ドライブがまだ開かれていません。ファイルマネージャーで「RPI-RP2」を開いてから「更新」を押してください。";
  } else if (pico || state.connected) {
    setDot("chkUsb", "ok");
    $("chkUsbText").textContent = (pico ? pico.device : state.port) + " で認識";
  } else if (res.ports.length) {
    setDot("chkUsb", "warn");
    $("chkUsbText").textContent = "ピコではないシリアル機器があります";
  } else {
    setDot("chkUsb", "err");
    $("chkUsbText").textContent = "見つかりません";
    html = `ピコが見つかりません。<br>
      ・USB ケーブルがデータ通信に対応しているか<br>
      ・BOOT ボタンを押しながらつなぐと「RPI-RP2」が出るか<br>を確認してください。`;
  }
  if (hint.dataset.src !== html) {
    hint.dataset.src = html;
    hint.innerHTML = html;
    bindFlash();
  }
}

function bindFlash() {
  const latest = $("flashLatestBtn"), pick = $("flashFileBtn"), file = $("uf2File");
  if (latest) latest.onclick = async () => {
    latest.disabled = true; latest.textContent = "ダウンロードして書き込み中…";
    try {
      const r = await api("/api/flash-latest", {});
      toast("書き込みました。ピコが再起動するので、数秒後に「更新」を押してください。\n" + r.url, true);
      setTimeout(refreshPorts, 4000);
    } catch (e) { toast(e.message); latest.disabled = false; latest.textContent = "最新の MicroPython を書き込む"; }
  };
  if (pick) pick.onclick = () => file.click();
  if (file) file.onchange = async () => {
    if (!file.files[0]) return;
    try {
      await api("/api/flash", await file.files[0].arrayBuffer(), true);
      toast("書き込みました。数秒後に「更新」を押してください。", true);
      setTimeout(refreshPorts, 4000);
    } catch (e) { toast(e.message); }
  };
}

async function checkMicroPython() {
  setDot("chkMp", ""); $("chkMpText").textContent = "確認中…";
  try {
    const i = await api("/api/info");
    state.mpOk = true;
    setDot("chkMp", "ok");
    const kb = (n) => Math.round(n / 1024) + " KB";
    $("chkMpText").textContent =
      `MicroPython ${i.version}\n${i.machine}\nストレージ空き ${kb(i.flash_free)} / ${kb(i.flash_total)}・メモリ空き ${kb(i.mem_free)}`;
    $("chkMpText").style.whiteSpace = "pre-line";
    loadFiles();
  } catch (e) {
    state.mpOk = false;
    setDot("chkMp", "err");

}

// ---------- 状態のポーリング ----------
const consoleEl = $("console");
function appendConsole(items) {
  if (!items.length) return;
  const atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 40;
  for (const it of items) {
    const last = consoleEl.lastChild;
    const text = it.text.replace(/\r\n/g, "\n").replace(/\r/g, "");
    if (last && last.dataset && last.dataset.kind === it.kind) last.textContent += text;
    else {
      const s = document.createElement("span");
      s.dataset.kind = it.kind; s.className = it.kind; s.textContent = text;
      consoleEl.appendChild(s);
    }
  }
  if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function poll() {
  try {
    const s = await api("/api/state?since=" + state.last);
    appendConsole(s.console);
    state.last = s.last;
    const changed = s.connected !== state.connected;
    state.connected = s.connected; state.running = s.running; state.port = s.port;
    updateUi();
    if (changed) {
      if (s.connected) setTimeout(checkMicroPython, 400);
      else { state.mpOk = null; setDot("chkMp", ""); $("chkMpText").textContent = "-"; renderFiles(null); }
      refreshPorts();
    }
  } catch (e) {
    $("connText").textContent = "サーバーに接続できません";
    setDot("connDot", "err");
  }
  setTimeout(poll, state.running ? 150 : 400);
}

function updateUi() {
  const c = state.connected, r = state.running;
  setDot("connDot", c ? (r ? "warn" : "ok") : "");
  $("connText").textContent = c ? (r ? "実行中" : "接続中") + "（" + state.port + "）" : "未接続";
  setDot("chkConn", c ? "ok" : "");
  $("chkConnText").textContent = c ? state.port : "-";
  $("connectBtn").disabled = c;
  $("disconnectBtn").disabled = !c;
  $("portSel").disabled = c;
  $("runBtn").disabled = !c || r;
  $("stopBtn").disabled = !c;
  $("saveBtn").disabled = !c || r;
  $("resetBtn").disabled = !c || r;
  $("filesBtn").disabled = !c || r;
  $("sendBtn").disabled = !c;
}

  const n = code.value.split("\n").length;

  try { localStorage.setItem("pico-studio-code", code.value); } catch (e) {}

  if (e.key === "Tab") {
    e.preventDefault();
    const s = code.selectionStart, en = code.selectionEnd;
    if (s === en && !e.shiftKey) {
      code.setRangeText("    ", s, en, "end");
    } else {
      const ls = code.value.lastIndexOf("\n", s - 1) + 1;
      const block = code.value.slice(ls, en);
      const out = e.shiftKey ? block.replace(/^ {1,4}/gm, "") : block.replace(/^/gm, "    ");
      code.setRangeText(out, ls, en, "select");
    }
    onCodeChange();
  } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
    // 自動インデント
    e.preventDefault();
    const s = code.selectionStart;
    const line = code.value.slice(code.value.lastIndexOf("\n", s - 1) + 1, s);
    let indent = line.match(/^\s*/)[0];
    if (/:\s*$/.test(line)) indent += "    ";
    code.setRangeText("\n" + indent, s, code.selectionEnd, "end");
    onCodeChange();
  }
});

  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }

// ガイド（guide/*.md を読み込んで表示する）
// =====================================================================
const guide = { chapters: [], index: 0, loaded: false };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function resolveUrl(u) {
  if (/^(https?:)?\/\//.test(u) || u.startsWith("/") || u.startsWith("#")) return u;
  return "/guide/" + u;
}

function youtubeId(u) {
  const m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

// 画像・動画（![説明](ファイル or URL)）
function mediaHtml(alt, src) {
  const yt = youtubeId(src);
  if (yt) {
    return `<iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${esc(alt)}" loading="lazy"
      allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  }
  const url = esc(resolveUrl(src));
  if (/\.(mp4|webm)$/i.test(src)) return `<video src="${url}" controls preload="metadata" title="${esc(alt)}"></video>`;
  return `<img src="${url}" alt="${esc(alt)}" loading="lazy">`;
}

// 行の中の書式: `コード` **太字** [リンク](URL) ![画像](URL)
function inline(text) {
  const codes = [];
  text = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  text = esc(text);
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => mediaHtml(a, u));
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
    const ext = /^https?:/.test(u);
    return `<a href="${esc(ext ? u : resolveUrl(u))}"${ext ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`;
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}

// 簡単な Markdown → HTML 変換（見出し・段落・リスト・表・引用・コード・画像・動画）
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  const codeBlocks = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());

  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^```\s*(\w*)\s*(.*)$/))) {           // コードブロック
      const lang = m[1], flags = m[2].split(/\s+/);
      const body = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;
      const code = body.join("\n");
      const run = lang === "python" && flags.includes("run");
      const label = run ? "▶ ピコで実行できるコード" : lang === "python" ? "PC で実行するコード" : "";
      codeBlocks.push(code);
      out.push(`<div class="codeblock${run ? " run" : ""}" data-code="${codeBlocks.length - 1}">
        <div class="cb-head"><span class="grow">${label}</span>
          ${run ? '<button data-act="insert" class="primary">エディタに入れる</button>' : ""}
          <button data-act="copy">コピー</button></div>
        <pre><code${lang === "bash" ? ' class="sh"' : ""}>${esc(code)}</code></pre></div>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {              // 見出し
      const n = m[1].length;
      out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue;
    }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if ((m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) {  // 1行だけの画像・動画
      out.push(mediaHtml(m[1], m[2])); i++; continue;
    }
    if (line.trim().startsWith("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {  // 表
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    if (/^>\s?/.test(line)) {                                   // 引用（注意書き）
      const body = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) body.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + body.filter((l) => l.trim()).map((l) => `<p>${inline(l)}</p>`).join("") + "</blockquote>");
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {                     // リスト
      const ordered = /^\s*\d+\./.test(line);
      const start = ordered ? parseInt(line.trim(), 10) : 1;   // 画像などをはさんだ続きの番号（例: 4.）から始める
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        const subs = [];                              // 字下げした「- 」は入れ子の箇条書き
        while (i < lines.length && /^\s{2,}\S/.test(lines[i])) {
          if (/^\s{2,}([-*]|\d+\.)\s+/.test(lines[i])) subs.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
          else if (subs.length) subs[subs.length - 1] += " " + lines[i++].trim();
          else item += " " + lines[i++].trim();       // 字下げされた続きの行
        }
        items.push(`<li>${inline(item)}${subs.length ? "<ul>" + subs.map((s) => `<li>${inline(s)}</li>`).join("") + "</ul>" : ""}</li>`);
      }
      out.push(ordered ? `<ol${start > 1 ? ` start="${start}"` : ""}>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
      continue;
    }
    const para = [];                                            // 段落
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s+|\|)/.test(lines[i])) {
      para.push(inline(lines[i++].trim()));
    }
    if (para.length) out.push(`<p>${para.join("<br>")}</p>`);
    else { out.push(`<p>${inline(lines[i++])}</p>`); }
  }
  return { html: out.join("\n"), codeBlocks };
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  toast("コピーしました", true);
}

async function showChapter(idx) {
  if (!guide.chapters.length) return;
  idx = Math.max(0, Math.min(guide.chapters.length - 1, idx));
  guide.index = idx;
  store.set("pico-studio-chapter", String(idx));
  const ch = guide.chapters[idx];
  $("guideToc").querySelector(".title").textContent = ch.title;
  $("guidePrev").disabled = idx === 0;
  $("guideNext").disabled = idx === guide.chapters.length - 1;
  const body = $("guideBody");
  try {
    const r = await fetch("/guide/" + ch.file, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const { html, codeBlocks } = renderMarkdown(await r.text());
    const prev = guide.chapters[idx - 1], next = guide.chapters[idx + 1];
    body.innerHTML = html + `<div class="guide-nav">
      ${prev ? `<button data-go="${idx - 1}">◀ ${esc(prev.title)}</button>` : "<span></span>"}
      ${next ? `<button data-go="${idx + 1}">${esc(next.title)} ▶</button>` : "<span></span>"}</div>`;
    body.querySelectorAll(".codeblock").forEach((cb) => {
      const code = codeBlocks[+cb.dataset.code];
      cb.querySelectorAll("button").forEach((b) => {
        b.onclick = () => (b.dataset.act === "copy" ? copyText(code) : insertCode(code));
      });
    });
    body.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => showChapter(+b.dataset.go)));
    body.scrollTop = 0;
  } catch (e) {
    body.innerHTML = `<p class="empty">章を読み込めませんでした（${esc(String(e.message || e))}）</p>`;
  }
}

function insertCode(snippet) {
  if (code.value.trim() && code.value !== snippet &&
      !confirm("今のコードを、ガイドのコードに置き換えますか？")) return;
  code.value = snippet;
  onCodeChange();
  code.focus();
  toast(state.connected ? "エディタに入れました。「▶ 実行」で動かせます" : "エディタに入れました。ピコに接続すると実行できます", true);
}

async function setGuideOpen(open) {
  $("main").classList.toggle("with-guide", open);
  $("guideBtn").classList.toggle("on", open);
  store.set("pico-studio-guide", open ? "1" : "0");
  if (open && !guide.loaded) {
    guide.loaded = true;
    try {
      guide.chapters = await (await fetch("/guide/chapters.json", { cache: "no-cache" })).json();
    } catch (e) {
      $("guideBody").innerHTML = '<p class="empty">ガイドを読み込めませんでした</p>';
      return;
    }
    const fromHash = location.hash.match(/chapter=(\d+)/);   // 例: http://localhost:8765/#chapter=5（章番号 = 並び順。0章から始まる）
    showChapter(fromHash ? +fromHash[1] : parseInt(store.get("pico-studio-chapter", "0"), 10) || 0);
  }
}

// 目次（章の中の見出しは ▶ で開く）
const toc = { sections: [], loaded: false, open: new Set() };

async function loadSections() {
  if (toc.loaded) return;
  toc.loaded = true;
  toc.sections = await Promise.all(guide.chapters.map(async (c) => {
    try {
      const md = await (await fetch("/guide/" + c.file, { cache: "no-cache" })).text();
      const doc = new DOMParser().parseFromString(renderMarkdown(md).html, "text/html");
      return [...doc.querySelectorAll("h2")].map((h) => h.textContent);
    } catch (e) { return []; }
  }));
}

function renderToc() {
  $("tocPanel").innerHTML = guide.chapters.map((c, i) => {
    const subs = toc.sections[i] || [], open = toc.open.has(i);
    return `<div class="toc-row${i === guide.index ? " current" : ""}">
        <button class="toc-fold" data-fold="${i}" aria-expanded="${open}" aria-label="${esc(c.title)} の見出しを開く"${subs.length ? "" : " disabled"}>▶</button>
        <button class="toc-go" data-ch="${i}">${esc(c.title)}</button></div>
      <ul class="toc-sub"${open ? "" : " hidden"}>${subs.map((t, n) =>
        `<li><button data-ch="${i}" data-sec="${n}">${esc(t)}</button></li>`).join("")}</ul>`;
  }).join("");
}

function closeToc() {
  $("tocPanel").hidden = true;
  $("guideToc").setAttribute("aria-expanded", "false");
}

$("guideToc").onclick = async () => {
  if (!$("tocPanel").hidden) return closeToc();
  await loadSections();
  toc.open = new Set([guide.index]);
  renderToc();
  $("tocPanel").hidden = false;
  $("guideToc").setAttribute("aria-expanded", "true");
  $("tocPanel").querySelector(".current").scrollIntoView({ block: "nearest" });
};
$("tocPanel").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.fold !== undefined) {
    const i = +b.dataset.fold;
    toc.open.has(i) ? toc.open.delete(i) : toc.open.add(i);
    b.setAttribute("aria-expanded", String(toc.open.has(i)));
    b.parentElement.nextElementSibling.hidden = !toc.open.has(i);
    return;
  }
  closeToc();
  await showChapter(+b.dataset.ch);
  if (b.dataset.sec !== undefined) $("guideBody").querySelectorAll("h2")[+b.dataset.sec]?.scrollIntoView({ block: "start" });
});
document.addEventListener("mousedown", (e) => {
  if (!$("tocPanel").contains(e.target) && !$("guideToc").contains(e.target)) closeToc();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("tocPanel").hidden) { closeToc(); $("guideToc").focus(); }
});

$("guideBtn").onclick = () => setGuideOpen(!$("main").classList.contains("with-guide"));
$("guideClose").onclick = () => setGuideOpen(false);
$("guidePrev").onclick = () => showChapter(guide.index - 1);

// ガイドと右側の仕切り（幅は % で持つので、ウィンドウを変えても比率が保たれる）
const GUIDE_MIN = 280, RIGHT_MIN = 564, GUIDE_DEFAULT = 40;
const splitter = $("splitter");

function mainBox() {
  const el = $("main"), cs = getComputedStyle(el), r = el.getBoundingClientRect();
  const left = r.left + parseFloat(cs.paddingLeft);
  return { left, width: r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) };
}
function setGuideWidth(pct, save = true) {
  const { width } = mainBox();
  const min = GUIDE_MIN / width * 100, max = (width - RIGHT_MIN) / width * 100;
  pct = Math.min(Math.max(pct, min), max);
  $("main").style.setProperty("--guide-w", pct.toFixed(2) + "%");
  splitter.setAttribute("aria-valuenow", Math.round(pct));
  if (save) store.set("pico-studio-guide-w", pct.toFixed(2));
  return pct;
}
function guideWidth() {
  return parseFloat($("main").style.getPropertyValue("--guide-w")) || GUIDE_DEFAULT;
}

splitter.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  splitter.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing");
});
splitter.addEventListener("pointermove", (e) => {
  if (!splitter.hasPointerCapture(e.pointerId)) return;
  const { left, width } = mainBox();
  setGuideWidth((e.clientX - 6 - left) / width * 100);
});
const endResize = () => document.body.classList.remove("resizing");
splitter.addEventListener("pointerup", endResize);
splitter.addEventListener("pointercancel", endResize);
splitter.addEventListener("dblclick", () => setGuideWidth(GUIDE_DEFAULT));
splitter.addEventListener("keydown", (e) => {
  const step = { ArrowLeft: -2, ArrowRight: 2 }[e.key];
  if (!step) return;
  e.preventDefault();
  setGuideWidth(guideWidth() + step);
});
const savedGuideW = parseFloat(store.get("pico-studio-guide-w", ""));
if (savedGuideW > 0) $("main").style.setProperty("--guide-w", savedGuideW + "%");

// =====================================================================
// 関数・引数の説明（コードの単語をクリックすると guide/glossary.json の説明を出す）
// =====================================================================
const tipEl = $("tip");
let glossary = {};
fetch("/guide/glossary.json", { cache: "no-cache" })
  .then((r) => r.json()).then((g) => (glossary = g)).catch(() => {});

// pos の位置にある単語（英数字と _）
function wordAt(text, pos) {
  let s = pos, e = pos;
  while (s > 0 && /\w/.test(text[s - 1])) s--;
  while (e < text.length && /\w/.test(text[e])) e++;
  return s === e ? null : { word: text.slice(s, e), start: s, end: e };
}

// pos を囲んでいる関数呼び出しの名前（例: "train_test_split(" の中なら train_test_split）
function enclosingCall(text, pos) {
  let depth = 0;
  for (let i = pos - 1; i >= 0; i--) {
    const c = text[i];
    if (")]}".includes(c)) depth++;
    else if ("([{".includes(c)) {
      if (depth > 0) { depth--; continue; }
      if (c !== "(") return null;
      const m = text.slice(0, i).match(/([A-Za-z_][\w.]*)\s*$/);
      return m ? m[1] : null;
    }
  }
  return null;
}

// 単語の説明を探す。引数なら「関数名.引数名」、Pin.OUT のような形なら「Pin.OUT」を先に探す
function lookupAt(text, pos) {
  const w = wordAt(text, pos);
  if (!w || /^\d/.test(w.word)) return null;
  const isKwarg = /^\s*=(?!=)/.test(text.slice(w.end));
  const fn = isKwarg ? enclosingCall(text, w.start) : null;
  const owner = text.slice(0, w.start).match(/([A-Za-z_]\w*)\.$/);
  const cands = [];
  if (fn) cands.push({ key: fn.split(".").pop() + "." + w.word, kind: "引数", label: `${fn}( ${w.word}= )` });
  if (owner) cands.push({ key: owner[1] + "." + w.word, kind: "", label: owner[1] + "." + w.word });
  cands.push({ key: w.word, kind: fn ? "引数" : /^\s*\(/.test(text.slice(w.end)) ? "関数" : "",
               label: fn ? `${fn}( ${w.word}= )` : w.word });
  for (const c of cands) if (typeof glossary[c.key] === "string") return { ...c, text: glossary[c.key] };
  return null;
}

// コマンドの説明。glossary のキーは "$ apt install" や "$ ls -l" のように $ で始める
// （run や list のような単語が Python の説明と混ざらないように分けている）
function shellKey(t) {
  if (/^\/dev\/ttyACM/.test(t)) return "/dev/ttyACM0";
  if (/\.uf2$/.test(t)) return "*.uf2";
  return t.replace(/(.):$/, "$1");            // 2e8a: → 2e8a
}
function isShellCommand(text) {
  return typeof glossary["$ " + text.trim().split(/\s+/)[0]] === "string";
}
function shellLookup(text, pos) {
  const start = text.lastIndexOf("\n", pos - 1) + 1;
  const nl = text.indexOf("\n", pos);
  const line = text.slice(start, nl < 0 ? text.length : nl), p = pos - start;
  let toks = [...line.matchAll(/"[^"]*"|'[^']*'|\S+/g)].map((m) => ({ t: m[0], s: m.index, e: m.index + m[0].length }));
  const comment = toks.findIndex((x) => x.t.startsWith("#"));
  if (comment >= 0) toks = toks.slice(0, comment);
  const i = toks.findIndex((x) => p >= x.s && p <= x.e);
  if (i < 0) return null;
  const t = toks[i].t;
  if (/^["']/.test(t)) {                             // mpremote exec "..." の中は Python
    const quoted = glossary["$ " + t.slice(1, -1)];  // 文字全体に説明があれば、それを出す
    return lookupAt(text, pos) || (typeof quoted === "string" ? { label: "引用符の中の文字", kind: "", text: quoted } : null);
  }

  let b = i;                                         // | で区切った、今のコマンドの先頭
  while (b > 0 && toks[b - 1].t !== "|") b--;
  if (toks[b].t === "sudo" && b + 1 < toks.length) b++;
  const cmd = toks[b].t, key = shellKey(t), prev = i > b ? toks[i - 1].t : "";
  const cands = [];
  if (i > b) cands.push(`${cmd} ${prev} ${key}`, `${cmd} ${key}`);
  cands.push(key);
  if (t.startsWith(":")) cands.push(":");
  const kind = i === b || t === "sudo" ? "コマンド" : t.startsWith("-") ? "オプション" : "";
  for (const c of cands) {
    const v = glossary["$ " + c];
    if (typeof v === "string") return { label: c.length > key.length ? c : t, kind, text: v };
  }
  return null;
}

function showTip(hit, x, y) {
  const m = hit.text.match(/^語源: (.*)\n([\s\S]*)$/);   // 先頭の「語源: 〜」は折りたたんで出す
  tipEl.innerHTML = `<div class="tip-head"><span class="tip-key">${esc(hit.label)}</span>
    ${hit.kind ? `<span class="tip-kind">${hit.kind}</span>` : ""}</div>
    <div class="tip-text">${esc(m ? m[2] : hit.text)}</div>
    ${m ? `<details><summary>語源</summary><div>${esc(m[1])}</div></details>` : ""}`;
  const details = tipEl.querySelector("details");
  if (details) details.addEventListener("toggle", () => {   // 開いて画面の下にはみ出したら、上へずらす
    const b = tipEl.getBoundingClientRect();
    if (b.bottom > innerHeight - 8) tipEl.style.top = Math.max(8, innerHeight - b.height - 8) + "px";
  });
  tipEl.style.display = "block";
  const r = tipEl.getBoundingClientRect();
  const left = Math.max(8, Math.min(x - 20, innerWidth - r.width - 8));
  const top = y + 18 + r.height < innerHeight ? y + 18 : Math.max(8, y - r.height - 12);
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px";
}
function hideTip() { tipEl.style.display = "none"; }

// ガイドのコード
$("guideBody").addEventListener("mouseup", (e) => {
  const codeEl = e.target.closest("code");
  const sel = getSelection();
  if (!codeEl || !sel.rangeCount) return hideTip();
  const r = sel.getRangeAt(0);
  if (!codeEl.contains(r.startContainer)) return hideTip();
  const before = document.createRange();
  before.setStart(codeEl, 0); before.setEnd(r.startContainer, r.startOffset);
  const text = codeEl.textContent, pos = before.toString().length;
  const isBlock = !!codeEl.closest("pre");
  const shell = isBlock ? codeEl.classList.contains("sh") : isShellCommand(text);
  if (!isBlock && !shell) return hideTip();
  const hit = shell ? shellLookup(text, pos) : lookupAt(text, pos);
  hit ? showTip(hit, e.clientX, e.clientY) : hideTip();
});
// エディタ
code.addEventListener("mouseup", (e) => {
  const hit = lookupAt(code.value, code.selectionStart);
  hit ? showTip(hit, e.clientX, e.clientY) : hideTip();
});
code.addEventListener("keydown", hideTip);
document.addEventListener("mousedown", (e) => { if (!tipEl.contains(e.target)) hideTip(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
$("guideBody").addEventListener("scroll", hideTip);
code.addEventListener("scroll", hideTip);
</script>
</body>
</html>
