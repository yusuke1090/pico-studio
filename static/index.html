<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico Studio</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #1d2330; --muted: #667085;
  --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f9d55; --warn: #c27c0e; --err: #d64545;
  --code-bg: #fbfbfc; --console-bg: #11151c; --console-text: #d7dde8; --sys: #7aa2f7; --gutter: #98a2b3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --border: #2c3340; --text: #e3e7ee; --muted: #8b95a7;
    --accent: #5b8def; --accent-text: #ffffff; --ok: #3ccf7a; --warn: #e3a33b; --err: #f06a6a;
    --code-bg: #151920; --console-bg: #0c0f14; --console-text: #d7dde8; --sys: #7aa2f7; --gutter: #5b6578;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, "Noto Sans JP", sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
select, input[type=text] { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--err); }
main { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: var(--rows, 1fr 1fr);
  grid-template-areas: "side code" "side console"; gap: 12px; padding: 12px 16px;
  height: calc(100vh - 56px); min-height: 520px; }
.side { grid-area: side; } .code-panel { grid-area: code; } .console-panel { grid-area: console; }
/* .panel の display: flex に負けないよう、main を付けて優先度を上げる */
main .guide-panel { grid-area: guide; display: none; }
/* --guide-w は仕切りのドラッグで変わる。280px と 564px は JS の GUIDE_MIN / RIGHT_MIN と同じ値にする */
main.with-guide { grid-template-columns: clamp(280px, var(--guide-w, 40%), calc(100% - 564px)) 240px minmax(0, 1fr);
  grid-template-rows: var(--rows, 1fr 1fr); grid-template-areas: "guide side code" "guide side console"; }
main.with-guide .guide-panel { display: flex; }
/* ガイドと同じマスに置き、右の余白（gap）へはみ出させて仕切りにする */
.splitter { grid-area: guide; display: none; justify-self: end; width: 12px; margin-right: -12px;
  position: relative; z-index: 1; cursor: col-resize; touch-action: none; outline: 0; }
main.with-guide .splitter { display: block; }
.splitter::after { content: ""; position: absolute; top: 50%; left: 50%; width: 4px; height: 48px;
  transform: translate(-50%, -50%); border-radius: 2px; background: var(--border); }
.splitter:hover::after, .splitter:focus-visible::after, body.resizing .splitter::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
/* コード欄と出力欄の間の仕切り。コード欄と同じマスに置き、下の余白（gap）へはみ出させる */
.hsplitter { grid-area: code; align-self: end; height: 12px; margin-bottom: -12px;
  position: relative; z-index: 1; cursor: row-resize; touch-action: none; outline: 0; }
.hsplitter::after { content: ""; position: absolute; top: 50%; left: 50%; width: 48px; height: 4px;
  transform: translate(-50%, -50%); border-radius: 2px; background: var(--border); }
.hsplitter:hover::after, .hsplitter:focus-visible::after, body.resizing-v .hsplitter::after { background: var(--accent); }
body.resizing-v { cursor: row-resize; user-select: none; }
header .spacer { flex: 1; }
#guideBtn.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel h2 { font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; }
.panel h2 .grow { flex: 1; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.checks { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 8px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks li .dot { margin-top: 6px; flex: none; }
.checks small { color: var(--muted); display: block; overflow-wrap: anywhere; }
#sampleSel { flex: 0 1 220px; min-width: 120px; }
.hint { margin: 0 12px 12px; padding: 8px 10px; border-radius: 6px; background: var(--bg);
  color: var(--muted); font-size: 12px; }
.hint:empty { display: none; }
.hint code { display: block; margin: 6px 0; padding: 4px 6px; border-radius: 4px; background: var(--console-bg);
  color: var(--console-text); font: 12px ui-monospace, "DejaVu Sans Mono", monospace; overflow-wrap: anywhere; }
.hint button { margin-top: 6px; }
.files { list-style: none; margin: 0; padding: 4px 0; overflow: auto; flex: 1; }
.files li { display: flex; align-items: center; gap: 6px; padding: 3px 12px; }
.files li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.files li .name:hover { color: var(--accent); }
.files li small { color: var(--muted); }
.files li button { padding: 0 6px; font-size: 12px; }
.empty { color: var(--muted); padding: 8px 12px; font-size: 12px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; }
.toolbar .grow { flex: 1; }
.editor { position: relative; flex: 1; display: flex; min-height: 0; background: var(--code-bg); }
.gutter { padding: 10px 8px 10px 10px; text-align: right; color: var(--gutter); user-select: none;
  font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", monospace; overflow: hidden; white-space: pre; }
textarea#code { flex: 1; border: 0; outline: 0; resize: none; padding: 10px; background: transparent;
  color: var(--text); font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", monospace; tab-size: 4;
  white-space: pre; overflow: auto; }
#console { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; background: var(--console-bg);
  color: var(--console-text); font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
  white-space: pre-wrap; word-break: break-all; }
#console .err { color: #ff8b8b; } #console .sys { color: var(--sys); }
.inputrow { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); }
.inputrow input { flex: 1; font-family: ui-monospace, monospace; }
.kbd { color: var(--muted); font-size: 12px; }
#toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px;
  border-radius: 8px; background: var(--err); color: #fff; display: none; white-space: pre-wrap; }
#toast.ok { background: var(--ok); }
/* ---------- 関数・引数の説明（クリックで表示） ---------- */
#tip { position: fixed; z-index: 10; max-width: min(380px, calc(100vw - 32px)); padding: 10px 12px;
  background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .25); font-size: 13px; line-height: 1.6; display: none; }
#tip .tip-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
#tip .tip-key { font: 600 13px ui-monospace, "DejaVu Sans Mono", monospace; color: var(--accent); }
#tip .tip-kind { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
#tip .tip-text { white-space: pre-line; }
#tip details { margin-top: 6px; font-size: 12px; color: var(--muted); }
#tip summary { cursor: pointer; width: fit-content; }
#tip details div { margin-top: 2px; }
/* ---------- ガイド ---------- */
.guide-head { display: flex; gap: 6px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); }
.guide-panel { position: relative; }
#guideToc { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; text-align: left; }
#guideToc .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#tocPanel { position: absolute; top: 50px; left: 12px; right: 12px; max-height: calc(100% - 62px); overflow: auto; z-index: 5;
  padding: 4px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
#tocPanel[hidden] { display: none; }
#tocPanel button { border: 0; background: none; border-radius: 4px; padding: 5px 8px; text-align: left; white-space: normal; }
#tocPanel button:hover { background: var(--bg); }
.toc-row { display: flex; align-items: center; }
.toc-row .toc-go { flex: 1; min-width: 0; font-weight: 600; }
.toc-row.current .toc-go { color: var(--accent); }
#tocPanel .toc-fold { flex: none; width: 28px; padding: 5px 0; text-align: center; color: var(--muted); }
.toc-fold[aria-expanded="true"] { transform: rotate(90deg); }
.toc-sub { list-style: none; margin: 0 0 4px; padding: 0 0 0 28px; }
.toc-sub[hidden] { display: none; }
.toc-sub button { width: 100%; font-size: 13px; color: var(--muted); }
.toc-part { margin: 10px 8px 2px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .05em; }
.toc-part:first-child { margin-top: 4px; }
.guide-body { flex: 1; overflow: auto; padding: 4px 20px 24px; line-height: 1.75; }
.guide-body h1 { font-size: 21px; margin: 16px 0 12px; }
.guide-body h2 { font-size: 17px; margin: 28px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.guide-body h3 { font-size: 15px; margin: 20px 0 8px; }
.guide-body p { margin: 8px 0; }
.guide-body ul, .guide-body ol { padding-left: 1.5em; margin: 8px 0; }
.guide-body a { color: var(--accent); }
.guide-body code { font: 12.5px ui-monospace, "DejaVu Sans Mono", monospace; background: var(--bg);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }
.guide-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
.guide-body th, .guide-body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
.guide-body th { background: var(--bg); }
.guide-body blockquote { margin: 10px 0; padding: 6px 12px; border-left: 4px solid var(--warn);
  background: var(--bg); border-radius: 0 6px 6px 0; color: var(--text); }
.guide-body hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
.guide-body img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); display: block; margin: 10px 0; }
.guide-body video, .guide-body iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 8px; margin: 10px 0; background: #000; }
.codeblock { margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.codeblock .cb-head { display: flex; align-items: center; gap: 6px; padding: 4px 8px; background: var(--bg);
  border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.codeblock .cb-head .grow { flex: 1; }
.codeblock .cb-head button { padding: 1px 8px; font-size: 12px; }
.codeblock.run .cb-head { color: var(--ok); }
.codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; background: var(--code-bg); }
.codeblock pre code { border: 0; background: none; padding: 0; white-space: pre; }
.guide-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--border); }
.guide-nav button { max-width: 48%; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 付箋・線（マーカー）・メモ ---------- */
:root { --hl-yellow: rgba(255, 214, 0, .55); --hl-pink: rgba(255, 105, 180, .38); --hl-green: rgba(60, 200, 100, .36);
  --hl-blue: rgba(80, 150, 255, .34); --st-yellow: #f7d84a; --st-pink: #f6a5c8; --st-green: #8fd4a4; --st-blue: #9cc0fa; }
@media (prefers-color-scheme: dark) {
  :root { --hl-yellow: rgba(255, 214, 0, .38); --hl-pink: rgba(255, 92, 170, .45); --hl-green: rgba(70, 210, 110, .38);
    --hl-blue: rgba(90, 150, 255, .48); }
}
.c-yellow { --hl: var(--hl-yellow); --st: var(--st-yellow); } .c-pink { --hl: var(--hl-pink); --st: var(--st-pink); }
.c-green { --hl: var(--hl-green); --st: var(--st-green); } .c-blue { --hl: var(--hl-blue); --st: var(--st-blue); }
/* 蛍光ペンで引いたように、文字の下の方だけ塗る。コードの中は全体を塗る */
mark.hl { color: inherit; background: linear-gradient(transparent 40%, var(--hl) 40%); padding: 0; border-radius: 2px;
  cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.guide-body code mark.hl { background: var(--hl); }
mark.hl.note-end::after { content: "📝"; font-size: 11px; margin-left: 2px; vertical-align: super; line-height: 0; }
.sticky-bar { display: flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; margin: 12px 0 4px;
  padding: 2px 12px 2px 10px; background: var(--st); color: #1d2330; border-radius: 3px 12px 12px 3px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3); font-size: 13px; font-weight: 600; line-height: 1.6; cursor: pointer; user-select: none; }
.sticky-bar .st-date { font-size: 11px; font-weight: 400; opacity: .7; }
li > .sticky-bar { margin-top: 4px; }
.anno-flash { animation: annoFlash 1.8s ease-out; }
@keyframes annoFlash { 0%, 45% { outline: 3px solid var(--accent); outline-offset: 2px; } 100% { outline: 3px solid transparent; outline-offset: 2px; } }
#annoBtn.on { border-color: var(--accent); }
#annoPop { position: fixed; z-index: 11; display: flex; flex-direction: column; gap: 8px; padding: 8px 10px;
  background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 8px;
  box-shadow: 0 6px 24px rgba(0, 0, 0, .3); font-size: 13px; max-width: min(360px, calc(100vw - 16px)); }
#annoPop[hidden] { display: none; }
#annoPop .ap-row { display: flex; align-items: center; gap: 6px; }
#annoPop .grow { flex: 1; }
#annoPop button { padding: 3px 9px; font-size: 13px; }
#annoPop .sep { width: 1px; align-self: stretch; background: var(--border); margin: 0 2px; }
#annoPop textarea, #annoPop input[type=text] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; width: min(320px, calc(100vw - 40px)); }
#annoPop textarea { resize: vertical; min-height: 64px; }
#annoPop .kbd { font-size: 11px; }
button.sw { width: 22px; height: 22px; padding: 0 !important; border-radius: 50%; background: var(--st); border: 2px solid transparent; }
button.sw.on { border-color: var(--text); }
#annoPanel { position: absolute; top: 50px; left: 12px; right: 12px; max-height: calc(100% - 62px); overflow: auto; z-index: 5;
  padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); }
#annoPanel[hidden] { display: none; }
#annoPanel .ap-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#annoPanel .ap-count { color: var(--muted); font-size: 12px; }
#annoPanel .ap-hint { margin: 6px 2px 4px; color: var(--muted); font-size: 12px; line-height: 1.6; }
#annoPanel .ap-ch { margin: 12px 4px 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
#annoPanel .ap-item { display: flex; align-items: stretch; gap: 2px; border-left: 4px solid var(--st); border-radius: 4px; margin: 2px 0; }
#annoPanel .ap-item:hover { background: var(--bg); }
#annoPanel .ap-go { flex: 1; min-width: 0; display: flex; gap: 6px; border: 0; background: none; text-align: left; white-space: normal; padding: 4px 6px; }
#annoPanel .ap-txt { min-width: 0; overflow-wrap: anywhere; }
#annoPanel .ap-txt small { display: block; color: var(--muted); font-size: 11.5px; }
#annoPanel .ap-txt small.lost { color: var(--warn); }
#annoPanel .ap-del { border: 0; background: none; color: var(--muted); padding: 2px 8px; }
#annoPanel .ap-del:hover { color: var(--err); }
.toc-pin { flex: none; font-size: 12px; margin-right: 4px; }

@media (max-width: 1000px) {
  main, main.with-guide { grid-template-columns: 1fr; grid-template-rows: none; height: auto;
    grid-template-areas: "guide" "side" "code" "console"; }
  main.with-guide .splitter, .hsplitter { display: none; }
  .guide-panel { height: 75vh; }
  .editor, #console { min-height: 320px; }
}
</style>
</head>
<body>
<header>
  <h1>Pico Studio</h1>
  <span class="dot" id="connDot"></span><span id="connText">未接続</span>
  <select id="portSel" title="シリアルポート"></select>
  <button id="refreshBtn" title="ポート一覧を更新">更新</button>
  <button id="connectBtn" class="primary">接続</button>
  <button id="disconnectBtn">切断</button>
  <span class="spacer"></span>
  <button id="guideBtn" title="使い方ガイドを横に表示">📘 ガイド</button>
</header>

<main id="main">
  <section class="panel guide-panel">
    <div class="guide-head">
      <button id="guidePrev" title="前の章">◀</button>
      <button id="guideToc" title="章を選ぶ" aria-expanded="false" aria-controls="tocPanel"><span class="title">読み込み中…</span><span aria-hidden="true">▾</span></button>
      <button id="guideNext" title="次の章">▶</button>
      <button id="annoBtn" title="付箋・線・メモの一覧" aria-expanded="false" aria-controls="annoPanel">🔖</button>
      <button id="guideClose" title="ガイドを閉じる">✕</button>
    </div>
    <div id="tocPanel" hidden></div>
    <div id="annoPanel" hidden></div>
    <div class="guide-body" id="guideBody"><p class="empty">読み込み中…</p></div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"
       aria-label="ガイドの幅" title="ドラッグで幅を変更（ダブルクリックで元に戻す）"></div>
  <div class="side">
    <section class="panel">
      <h2>接続の確認</h2>
      <ul class="checks">
        <li><span class="dot" id="chkUsb"></span><div>USB で認識<small id="chkUsbText">-</small></div></li>
        <li><span class="dot" id="chkConn"></span><div>シリアル接続<small id="chkConnText">-</small></div></li>
        <li><span class="dot" id="chkMp"></span><div>動いているプログラム<small id="chkMpText">-</small></div></li>
        <li><span class="dot" id="chkEnv"></span><div>C++ の開発環境<small id="chkEnvText">-</small></div></li>
      </ul>
      <div class="hint" id="envHint"></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="panel" style="flex:1">
      <h2><span class="grow" title="MicroPython のときだけ">ピコのファイル</span><button id="filesBtn" title="一覧を更新">更新</button></h2>
      <ul class="files" id="files"><li class="empty">接続すると表示されます</li></ul>
    </section>
  </div>

  <section class="panel code-panel">
    <h2>コード<span class="kbd">（MicroPython で手早く試す。C++ の開発は VS Code で）</span></h2>
    <div class="toolbar">
      <select id="sampleSel">
        <option value="">サンプルを選ぶ…</option>
      </select>
      <span class="grow"></span>
      <button id="runBtn" class="primary" title="Ctrl+Enter">▶ 実行</button>
      <button id="stopBtn" class="danger">■ 停止</button>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="toolbar">
      <input type="text" id="fileName" value="main.py" size="14" title="保存するときの名前">
      <button id="saveBtn" title="Ctrl+S">ピコに保存</button>
      <span class="kbd">main.py にすると電源を入れたとき自動で動きます</span>
    </div>
  </section>

  <div class="hsplitter" id="hsplitter" role="separator" aria-orientation="horizontal" tabindex="0"
       aria-label="コード欄の高さ" title="ドラッグで高さを変更（ダブルクリックで元に戻す）"></div>
  <section class="panel console-panel">
    <h2><span class="grow">出力</span>
      <button id="resetBtn" title="ピコを再起動（main.py が実行される）">リセット</button>
      <button id="clearBtn">クリア</button></h2>
    <pre id="console"></pre>
    <div class="inputrow">
      <input type="text" id="sendInput" placeholder="ピコに送る（REPL のコマンドや input() への入力）" autocomplete="off">
      <button id="sendBtn">送信</button>
    </div>
  </section>
</main>
<div id="toast"></div>
<div id="tip" role="tooltip"></div>
<div id="annoPop" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const SAMPLES = {
  "hello: 文字と計算": `print("hello, pico!")
for i in range(1, 6):
    print(i, "x 2 =", i * 2)
`,

function toast(msg, ok = false) {
  const t = $("toast");
  t.textContent = msg; t.className = ok ? "ok" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ok ? 2500 : 7000);
}

async function api(path, body, raw) {
  const opt = body === undefined ? {} : {
    method: "POST",
    headers: raw ? { "Content-Type": "application/octet-stream" } : { "Content-Type": "application/json" },
    body: raw ? body : JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "サーバーの応答が読めません" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function setDot(id, cls) { $(id).className = "dot" + (cls ? " " + cls : ""); }
const tilde = (p) => (state.home && p && p.startsWith(state.home + "/") ? "~" + p.slice(state.home.length) : p);

const isOldServer = (e) => /not found/i.test(e.message || "");

async function refreshPorts() {
  let res;
  try { res = await api("/api/ports"); } catch (e) { return toast(e.message); }
  const sel = $("portSel"), prev = sel.value;
  sel.innerHTML = "";
  for (const p of res.ports) {
    const o = document.createElement("option");
    o.value = p.device;
    o.textContent = p.device + (p.is_pico ? `  (ピコ・${KIND[p.kind] || ""})` : p.description ? "  " + p.description : "");
    sel.appendChild(o);
  }
  if (!res.ports.length) {
    const o = document.createElement("option"); o.value = ""; o.textContent = "ポートが見つかりません";
    sel.appendChild(o);
  }
  if (state.port && ![...sel.options].some((o) => o.value === state.port)) {
    const o = document.createElement("option"); o.value = o.textContent = state.port; sel.appendChild(o);
  }
  if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
  if (state.port) sel.value = state.port;

  const pico = res.ports.find((p) => p.is_pico);
  const hint = $("hint");
  let html = "";
  if (res.bootsel.detected) {
    setDot("chkUsb", "warn");
    $("chkUsbText").textContent = "BOOTSEL モード（書き込み待ち）";
    html = res.bootsel.mount
      ? `ピコが書き込みモードになっています。MicroPython か、VS Code でビルドした .uf2 を書き込めます。<br>
         <button id="flashLatestBtn" class="primary">最新の MicroPython を書き込む</button>
         <button id="flashFileBtn">.uf2 ファイルを選ぶ</button>
         <input type="file" id="uf2File" accept=".uf2" hidden>`
      : "ピコが書き込みモードで見えていますが、ドライブがまだ開かれていません。ファイルマネージャーで「RPI-RP2」を開いてから「更新」を押してください。";
  } else if (pico || state.connected) {
    setDot("chkUsb", "ok");
    $("chkUsbText").textContent = (pico ? `${pico.device} で認識（${KIND[pico.kind] || "?"}）` : state.port + " で認識");
  } else if (res.ports.length) {
    setDot("chkUsb", "warn");
    $("chkUsbText").textContent = "ピコではないシリアル機器があります";
  } else {
    setDot("chkUsb", "err");
    $("chkUsbText").textContent = "見つかりません";

      ・USB ケーブルがデータ通信に対応しているか<br>
      ・BOOT ボタンを押しながらつなぐと「RPI-RP2」が出るか<br>
      ・USB を使わない C++ のプログラムが動いていないか<br>を確認してください。`;
  }
  if (hint.dataset.src !== html) {

}

const consoleEl = $("console");
function appendConsole(items) {
  if (!items.length) return;
  const atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 40;
  for (const it of items) {
    const last = consoleEl.lastChild;
    const text = it.text.replace(/\r\n/g, "\n").replace(/\r/g, "");
    if (last && last.dataset && last.dataset.kind === it.kind) last.textContent += text;
    else {
      const s = document.createElement("span");
      s.dataset.kind = it.kind; s.className = it.kind; s.textContent = text;
      consoleEl.appendChild(s);
    }
  }
  if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function poll() {
  try {
    const s = await api("/api/state?since=" + state.last);
    appendConsole(s.console);
    state.last = s.last;
    const changed = s.connected !== state.connected || s.mode !== state.mode;
    state.connected = s.connected; state.running = s.running; state.port = s.port; state.mode = s.mode;
    updateUi();
    if (changed) {
      if (s.connected) setTimeout(checkProgram, 400);
      else { state.mpOk = null; checkProgram(); renderFiles(null); }
      refreshPorts();
    }
  } catch (e) {
    $("connText").textContent = "サーバーに接続できません";
    setDot("connDot", "err");
  }
  setTimeout(poll, state.running ? 150 : 400);
}

function updateUi() {
  const c = state.connected, r = state.running, py = state.mode === "python";
  setDot("connDot", c ? (r ? "warn" : "ok") : "");
  $("connText").textContent = c ? (r ? "実行中" : py ? "接続中" : "C++ の出力を表示中") + "（" + state.port + "）" : "未接続";

  $("disconnectBtn").disabled = !c;
  $("portSel").disabled = c;
  $("runBtn").disabled = !c || r || !py;
  $("stopBtn").disabled = !c || !py;

const code = $("code"), gutter = $("gutter");
function onCodeChange() {
  const n = code.value.split("\n").length;
  gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
  try { localStorage.setItem("pico-studio-code", code.value); } catch (e) {}
}
code.addEventListener("input", onCodeChange);
code.addEventListener("scroll", () => (gutter.scrollTop = code.scrollTop));
code.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = code.selectionStart, en = code.selectionEnd;
    if (s === en && !e.shiftKey) {
      code.setRangeText("    ", s, en, "end");
    } else {
      const ls = code.value.lastIndexOf("\n", s - 1) + 1;
      const block = code.value.slice(ls, en);
      const out = e.shiftKey ? block.replace(/^ {1,4}/gm, "") : block.replace(/^/gm, "    ");
      code.setRangeText(out, ls, en, "select");
    }
    onCodeChange();
  } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
    // 自動インデント
    e.preventDefault();
    const s = code.selectionStart;
    const line = code.value.slice(code.value.lastIndexOf("\n", s - 1) + 1, s);
    let indent = line.match(/^\s*/)[0];
    if (/:\s*$/.test(line)) indent += "    ";
    code.setRangeText("\n" + indent, s, code.selectionEnd, "end");
    onCodeChange();
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
});

  if (!document.execCommand("insertText", false, text)) code.value = text;   // 使えないブラウザでは、そのまま入れる
  code.setSelectionRange(0, 0);
  code.scrollTop = 0;
  onCodeChange();
}

const guide = { chapters: [], index: 0, loaded: false };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function resolveUrl(u) {
  if (/^(https?:)?\/\//.test(u) || u.startsWith("/") || u.startsWith("#")) return u;
  return "/guide/" + u;
}

function youtubeId(u) {
  const m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

// 画像・動画（![説明](ファイル or URL)）
function mediaHtml(alt, src) {
  const yt = youtubeId(src);
  if (yt) {
    return `<iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${esc(alt)}" loading="lazy"
      allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  }
  const url = esc(resolveUrl(src));
  if (/\.(mp4|webm)$/i.test(src)) return `<video src="${url}" controls preload="metadata" title="${esc(alt)}"></video>`;
  return `<img src="${url}" alt="${esc(alt)}" loading="lazy">`;
}

// 行の中の書式: `コード` **太字** [リンク](URL) ![画像](URL)
function inline(text) {
  const codes = [];
  text = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  text = esc(text);
  text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, a, u) => mediaHtml(a, u));
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
    const ext = /^https?:/.test(u);
    return `<a href="${esc(ext ? u : resolveUrl(u))}"${ext ? ' target="_blank" rel="noopener"' : ""}>${t}</a>`;
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[i])}</code>`);
}

// 簡単な Markdown → HTML 変換（見出し・段落・リスト・表・引用・コード・画像・動画）
function renderMarkdown(src) {
  const lines = src.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  const codeBlocks = [];
  let i = 0;
  const isTableSep = (l) => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
  // 表のマス。「\|」は区切りではなく、縦線の文字として表示する（GitHub と同じ）
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/(?<!\\)\|$/, "").split(/(?<!\\)\|/)
    .map((c) => c.trim().replace(/\\\|/g, "|"));

  while (i < lines.length) {
    const line = lines[i];
    let m;
    if ((m = line.match(/^```\s*(\w*)\s*(.*)$/))) {           // コードブロック
      const lang = m[1], flags = m[2].split(/\s+/);
      const body = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;
      const code = body.join("\n");
      const run = lang === "python" && flags.includes("run");
      const label = run ? "▶ ピコで実行できるコード（MicroPython）"
        : lang === "python" ? "PC で実行するコード（Python）"
        : lang === "cpp" && flags.includes("run") ? "C++ のプログラム（VS Code のプロジェクトの .cpp に貼り付ける）"
        : lang === "cpp" ? "C++ のコード（一部分）" : lang === "cmake" ? "CMakeLists.txt" : "";
      codeBlocks.push({ code, lang });
      out.push(`<div class="codeblock${run ? " run" : ""}" data-code="${codeBlocks.length - 1}">
        <div class="cb-head"><span class="grow">${label}</span>
          ${run ? '<button data-act="insert" class="primary">エディタに入れる</button>' : ""}
          <button data-act="copy">コピー</button></div>
        <pre><code${lang === "bash" ? ' class="sh"' : ""}>${esc(code)}</code></pre></div>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {              // 見出し
      const n = m[1].length;
      out.push(`<h${n}>${inline(m[2])}</h${n}>`); i++; continue;
    }
    if (/^\s*(---|\*\*\*)\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if ((m = line.match(/^\s*!\[([^\]]*)\]\(([^)\s]+)\)\s*$/))) {  // 1行だけの画像・動画
      out.push(mediaHtml(m[1], m[2])); i++; continue;
    }
    if (line.trim().startsWith("|") && i + 1 < lines.length && isTableSep(lines[i + 1])) {  // 表
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map((c) => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>");
      continue;
    }
    if (/^>\s?/.test(line)) {                                   // 引用（注意書き）
      const body = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) body.push(lines[i++].replace(/^>\s?/, ""));
      out.push("<blockquote>" + body.filter((l) => l.trim()).map((l) => `<p>${inline(l)}</p>`).join("") + "</blockquote>");
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {                     // リスト
      const ordered = /^\s*\d+\./.test(line);
      const start = ordered ? parseInt(line.trim(), 10) : 1;   // 画像などをはさんだ続きの番号（例: 4.）から始める
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        const subs = [];                              // 字下げした「- 」は入れ子の箇条書き
        while (i < lines.length && /^\s{2,}\S/.test(lines[i])) {
          if (/^\s{2,}([-*]|\d+\.)\s+/.test(lines[i])) subs.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
          else if (subs.length) subs[subs.length - 1] += " " + lines[i++].trim();
          else item += " " + lines[i++].trim();       // 字下げされた続きの行
        }
        items.push(`<li>${inline(item)}${subs.length ? "<ul>" + subs.map((s) => `<li>${inline(s)}</li>`).join("") + "</ul>" : ""}</li>`);
      }
      out.push(ordered ? `<ol${start > 1 ? ` start="${start}"` : ""}>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`);
      continue;
    }
    const para = [];                                            // 段落
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s+|\|)/.test(lines[i])) {
      para.push(inline(lines[i++].trim()));
    }
    if (para.length) out.push(`<p>${para.join("<br>")}</p>`);
    else { out.push(`<p>${inline(lines[i++])}</p>`); }
  }
  return { html: out.join("\n"), codeBlocks };
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
  toast("コピーしました", true);
}

async function showChapter(idx, opts = {}) {
  if (!guide.chapters.length) return;
  const scrollRatio = $("guideBody").scrollTop / Math.max(1, $("guideBody").scrollHeight);
  idx = Math.max(0, Math.min(guide.chapters.length - 1, idx));
  guide.index = idx;
  store.set("pico-studio-chapter", String(idx));
  const ch = guide.chapters[idx];
  $("guideToc").querySelector(".title").textContent = ch.title;
  $("guidePrev").disabled = idx === 0;
  $("guideNext").disabled = idx === guide.chapters.length - 1;
  const body = $("guideBody");
  try {
    const r = await fetch("/guide/" + ch.file, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    const { html, codeBlocks } = renderMarkdown(await r.text());
    const prev = guide.chapters[idx - 1], next = guide.chapters[idx + 1];
    body.innerHTML = html + `<div class="guide-nav">
      ${prev ? `<button data-go="${idx - 1}">◀ ${esc(prev.title)}</button>` : "<span></span>"}
      ${next ? `<button data-go="${idx + 1}">${esc(next.title)} ▶</button>` : "<span></span>"}</div>`;
    body.querySelectorAll(".codeblock").forEach((cb) => {
      const blk = codeBlocks[+cb.dataset.code];
      cb.querySelectorAll("button").forEach((b) => {
        b.onclick = () => (b.dataset.act === "copy" ? copyText(blk.code) : insertCode(blk.code));
      });
    });
    body.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => showChapter(+b.dataset.go)));
    await annoLoading;
    applyAnno();
    if (!$("annoPanel").hidden) renderAnnoPanel();
    if (opts.keepScroll) body.scrollTop = Math.min(scrollRatio * body.scrollHeight, body.scrollHeight);
    else body.scrollTop = 0;
    if (opts.restore) restoreReadPos();
  } catch (e) {
    body.innerHTML = `<p class="empty">章を読み込めませんでした（${esc(String(e.message || e))}）</p>`;
  }
}

function insertCode(snippet) {
  replaceCode(snippet);
  toast((state.connected ? "エディタに入れました。「▶ 実行」で動かせます" : "エディタに入れました。ピコに接続すると実行できます")
    + "\n前のコードには Ctrl + Z で戻せます", true);
}

async function setGuideOpen(open) {
  $("main").classList.toggle("with-guide", open);
  $("guideBtn").classList.toggle("on", open);
  store.set("pico-studio-guide", open ? "1" : "0");
  if (open && !guide.loaded) {
    guide.loaded = true;
    try {
      guide.chapters = await (await fetch("/guide/chapters.json", { cache: "no-cache" })).json();
    } catch (e) {
      $("guideBody").innerHTML = '<p class="empty">ガイドを読み込めませんでした。ガイドは教科書のリポジトリにあります。<br>'
        + '<code>git clone https://github.com/yusuke1090/textbooks.git ~/apps/textbooks</code> を打ってから、Pico Studio を起動し直してください。</p>';
      return;
    }
    const fromHash = location.hash.match(/chapter=(\d+)/);   // 例: http://localhost:8765/#chapter=5（章番号 = 並び順。0章から始まる）
    await showChapter(fromHash ? +fromHash[1] : parseInt(store.get("pico-studio-chapter", "0"), 10) || 0, { restore: true });
  }
}

// ガイドの章を開いて、見出しの場所まで動かす（例: openGuideAt("14-cpp.md", "開発環境を用意する")）
async function openGuideAt(file, heading) {
  if (!$("main").classList.contains("with-guide") || !guide.loaded) await setGuideOpen(true);
  const idx = guide.chapters.findIndex((c) => c.file === file);
  if (idx < 0) return;
  if (idx !== guide.index || !$("guideBody").querySelector("h2")) await showChapter(idx);
  const h = [...$("guideBody").querySelectorAll("h2, h3")].find((x) => x.textContent.includes(heading));
  if (h) h.scrollIntoView({ block: "start" });
}

// 目次（章の中の見出しは ▶ で開く）
const toc = { sections: [], loaded: false, open: new Set() };

async function loadSections() {
  if (toc.loaded) return;
  toc.loaded = true;
  toc.sections = await Promise.all(guide.chapters.map(async (c) => {
    try {
      const md = await (await fetch("/guide/" + c.file, { cache: "no-cache" })).text();
      const doc = new DOMParser().parseFromString(renderMarkdown(md).html, "text/html");
      return [...doc.querySelectorAll("h2")].map((h) => h.textContent);
    } catch (e) { return []; }
  }));
}

function renderToc() {
  $("tocPanel").innerHTML = guide.chapters.map((c, i) => {
    const subs = toc.sections[i] || [], open = toc.open.has(i);
    const part = c.part && c.part !== (guide.chapters[i - 1] || {}).part ? `<div class="toc-part">${esc(c.part)}</div>` : "";
    return part + `<div class="toc-row${i === guide.index ? " current" : ""}">
        <button class="toc-fold" data-fold="${i}" aria-expanded="${open}" aria-label="${esc(c.title)} の見出しを開く"${subs.length ? "" : " disabled"}>▶</button>
        <button class="toc-go" data-ch="${i}">${esc(c.title)}</button>${pinBadge(c.file)}</div>
      <ul class="toc-sub"${open ? "" : " hidden"}>${subs.map((t, n) =>
        `<li><button data-ch="${i}" data-sec="${n}">${esc(t)}</button></li>`).join("")}</ul>`;
  }).join("");
}

function closeToc() {
  $("tocPanel").hidden = true;
  $("guideToc").setAttribute("aria-expanded", "false");
}

$("guideToc").onclick = async () => {
  if (!$("tocPanel").hidden) return closeToc();
  closeAnnoPanel();
  await loadSections();
  toc.open = new Set([guide.index]);
  renderToc();
  $("tocPanel").hidden = false;
  $("guideToc").setAttribute("aria-expanded", "true");
  $("tocPanel").querySelector(".current").scrollIntoView({ block: "nearest" });
};
$("tocPanel").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.fold !== undefined) {
    const i = +b.dataset.fold;
    toc.open.has(i) ? toc.open.delete(i) : toc.open.add(i);
    b.setAttribute("aria-expanded", String(toc.open.has(i)));
    b.parentElement.nextElementSibling.hidden = !toc.open.has(i);
    return;
  }
  closeToc();
  await showChapter(+b.dataset.ch);
  if (b.dataset.sec !== undefined) $("guideBody").querySelectorAll("h2")[+b.dataset.sec]?.scrollIntoView({ block: "start" });
});
document.addEventListener("mousedown", (e) => {
  if (!$("tocPanel").contains(e.target) && !$("guideToc").contains(e.target)) closeToc();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("tocPanel").hidden) { closeToc(); $("guideToc").focus(); }
});

// =====================================================================
// 付箋・線（マーカー）・メモ
// サーバーの ~/.local/share/pico-studio/notes.json に保存する。
// 場所は「選んだ文字・その前後の文字・だいたいの位置」で覚えるので、ガイドの文章を直しても、
// 同じ文字が残っていれば同じ場所に付く。
// =====================================================================
const COLORS = { yellow: "黄", pink: "ピンク", green: "緑", blue: "青" };
const anno = { items: [], ready: false, error: "", saveTimer: 0, lost: new Set(), pending: null };
const pop = $("annoPop");

async function loadAnno() {
  try {
    anno.items = (await api("/api/notes")).items;
    anno.ready = true;
  } catch (e) {
    anno.error = isOldServer(e) ? OLD_SERVER : "付箋・メモを読み込めませんでした: " + e.message;
  }
}
const annoLoading = loadAnno();

function saveAnno() {
  clearTimeout(anno.saveTimer);
  anno.saveTimer = setTimeout(async () => {
    anno.saveTimer = 0;
    try { await api("/api/notes", { items: anno.items }); }
    catch (e) { toast(isOldServer(e) ? OLD_SERVER : "付箋・メモを保存できませんでした: " + e.message); }
  }, 300);
}
// 保存する前にタブを閉じたときも、残す
addEventListener("pagehide", () => {
  if (!anno.saveTimer) return;
  clearTimeout(anno.saveTimer);
  navigator.sendBeacon("/api/notes", JSON.stringify({ items: anno.items }));
});

// ガイドの本文の文字を1本の文字列にして、どの文字がどのテキストノードにあるかを持つ
// （付箋や、コードのラベル・ボタン、章の終わりの「次の章」は数えない）
function textIndex(root) {
  const nodes = [], starts = [];
  let text = "";
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => n.parentElement.closest("[data-anno-ui], .cb-head, .guide-nav")
      ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  for (let n; (n = w.nextNode());) { nodes.push(n); starts.push(text.length); text += n.data; }
  return { nodes, starts, text };
}
function nodeAt(idx, off) {
  for (let k = 0; k < idx.nodes.length; k++) {
    if (off < idx.starts[k] + idx.nodes[k].data.length) return k;
  }
  return -1;
}
// 選んだ範囲の端（ノードと位置）を、文字列の何文字目かにする
function pointToOffset(idx, container, offset) {
  if (container.nodeType === Node.TEXT_NODE) {
    const k = idx.nodes.indexOf(container);
    if (k >= 0) return idx.starts[k] + offset;
  }
  const probe = document.createRange();
  probe.setStart(container, offset);
  for (let k = 0; k < idx.nodes.length; k++) {
    if (probe.comparePoint(idx.nodes[k], 0) >= 0) return idx.starts[k];
  }
  return idx.text.length;
}
function makeAnchor(text, s, e) {
  return { exact: text.slice(s, e), prefix: text.slice(Math.max(0, s - 32), s), suffix: text.slice(e, e + 32), pos: s };
}
function rangeToAnchor(range) {
  const idx = textIndex($("guideBody"));
  let s = pointToOffset(idx, range.startContainer, range.startOffset);
  let e = pointToOffset(idx, range.endContainer, range.endOffset);
  while (s < e && /\s/.test(idx.text[s])) s++;
  while (e > s && /\s/.test(idx.text[e - 1])) e--;
  return e > s ? makeAnchor(idx.text, s, e) : null;
}
// 覚えた文字を本文から探す。同じ文字が何か所もあれば、前後の文字がいちばん合う所にする
function locate(idx, a) {
  const t = idx.text;
  let best = -1, bestScore = -Infinity;
  for (let p = a.exact ? t.indexOf(a.exact) : -1; p >= 0; p = t.indexOf(a.exact, p + 1)) {
    let sc = 0;
    const pre = a.prefix || "", suf = a.suffix || "", after = p + a.exact.length;
    while (sc < pre.length && p - sc - 1 >= 0 && t[p - sc - 1] === pre[pre.length - sc - 1]) sc++;
    let k = 0;
    while (k < suf.length && t[after + k] === suf[k]) k++;
    const score = sc + k - Math.abs(p - (a.pos || 0)) / 1e7;
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return best < 0 ? null : { start: best, end: best + a.exact.length };
}
// start〜end の文字を <mark> で包む（テキストノードをまたいでもよい）
function wrapRange(root, start, end, make) {
  const idx = textIndex(root), marks = [];
  idx.nodes.forEach((n, k) => {
    const ns = idx.starts[k], len = n.data.length;
    if (ns + len <= start || ns >= end) return;
    const a = Math.max(0, start - ns), b = Math.min(len, end - ns);
    if (!n.data.slice(a, b).trim()) return;
    let target = n;
    if (a > 0) target = target.splitText(a);
    if (b - a < target.data.length) target.splitText(b - a);
    const m = make();
    target.before(m);
    m.appendChild(target);
    marks.push(m);
  });
  return marks;
}
// 付箋は、その文字がある段落・見出し・表・コードなどの上に貼る（箇条書きは、その項目の中）
function placeSticky(root, node, it) {
  const bar = document.createElement("div");
  bar.className = "sticky-bar c-" + it.color;
  bar.dataset.annoUi = "";
  bar.dataset.id = it.id;
  bar.title = "押すと、文字や色を変えたり、はがしたりできます";
  bar.innerHTML = `<span>📌 ${esc(it.note || "付箋")}</span><span class="st-date">${fmtDate(it.created)}</span>`;
  const el = node.parentElement, big = el.closest(".codeblock, table, blockquote, li");
  if (el === root || !root.contains(el)) return root.prepend(bar);
  if (big && big.tagName === "LI") return big.prepend(bar);
  let b = big || el;
  while (b.parentElement && b.parentElement !== root) b = b.parentElement;
  b.before(bar);
}
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : `${d.getMonth() + 1}/${d.getDate()}`;
}

function currentFile() { return (guide.chapters[guide.index] || {}).file; }

function applyAnno() {
  const body = $("guideBody"), file = currentFile();
  anno.lost = new Set();
  if (!anno.ready || !file) return;
  const mine = anno.items.filter((x) => x.file === file);
  for (const it of mine.filter((x) => x.type === "mark")) {
    const r = locate(textIndex(body), it);
    if (!r) { anno.lost.add(it.id); continue; }
    const marks = wrapRange(body, r.start, r.end, () => {
      const m = document.createElement("mark");
      m.className = "hl c-" + it.color;
      m.dataset.id = it.id;
      if (it.note) m.title = it.note;
      return m;
    });
    if (it.note && marks.length) marks[marks.length - 1].classList.add("note-end");
  }
  for (const it of mine.filter((x) => x.type === "sticky")) {
    const idx = textIndex(body), r = locate(idx, it);
    if (!r) { anno.lost.add(it.id); continue; }
    placeSticky(body, idx.nodes[nodeAt(idx, r.start)], it);
  }
}
function clearAnno() {
  const body = $("guideBody");
  body.querySelectorAll(".sticky-bar").forEach((b) => b.remove());
  body.querySelectorAll("mark.hl").forEach((m) => m.replaceWith(...m.childNodes));
  body.normalize();
}
function refreshAnno() {
  const body = $("guideBody"), top = body.scrollTop;   // 包み直しても、見ている場所が動かないように
  clearAnno();
  applyAnno();
  body.scrollTop = top;
  if (!$("annoPanel").hidden) renderAnnoPanel();
}

function addItem(type, anchor, extra = {}) {
  if (!anno.ready) { toast(anno.error || "付箋・メモを読み込み中です。少し待ってからもう一度"); return null; }
  const it = { id: type[0] + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type,
    file: currentFile(), color: "yellow", note: "", created: new Date().toISOString(), ...anchor, ...extra };
  anno.items.push(it);
  saveAnno();
  return it;
}
function removeItem(id) {
  anno.items = anno.items.filter((x) => x.id !== id);
  saveAnno();
}
const findItem = (id) => anno.items.find((x) => x.id === id);

// ---------- 吹き出し（選んだときのボタン・線やメモの編集・付箋の編集） ----------
function placePop(rect) {
  pop.hidden = false;
  const r = pop.getBoundingClientRect();
  const left = Math.max(8, Math.min(rect.left, innerWidth - r.width - 8));
  const top = rect.top - r.height - 8 >= 8 ? rect.top - r.height - 8 : Math.min(rect.bottom + 8, innerHeight - r.height - 8);
  pop.style.left = left + "px";
  pop.style.top = Math.max(8, top) + "px";
}
function closePop() {
  if (pop.hidden) return;
  const done = pop._onclose;
  pop._onclose = null;
  pop.hidden = true;
  pop.dataset.kind = "";
  if (done) done();
}
const swatches = (cur) => Object.entries(COLORS).map(([c, name]) =>
  `<button class="sw c-${c}${c === cur ? " on" : ""}" data-color="${c}" title="${name}" aria-label="${name}"></button>`).join("");

// 文字を選んだら、線・メモ・付箋のボタンを出す
function showSelBar(rect) {
  closePop();
  pop.dataset.kind = "sel";
  pop.setAttribute("role", "toolbar");
  pop.innerHTML = `<div class="ap-row">${swatches("")}<span class="sep"></span>
    <button data-act="memo" title="線を引いて、メモを書く">📝 メモ</button>
    <button data-act="sticky" title="ここに付箋を貼る（どこまで読んだかの目印）">📌 付箋</button></div>`;
  pop.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b || !anno.pending) return;
    const a = anno.pending;
    anno.pending = null;
    getSelection().removeAllRanges();
    closePop();
    if (b.dataset.color) {
      if (addItem("mark", a, { color: b.dataset.color })) refreshAnno();
    } else if (b.dataset.act === "memo") {
      const it = addItem("mark", a);
      if (it) { refreshAnno(); editMark(it.id, true); }
    } else if (b.dataset.act === "sticky") {
      const it = addItem("sticky", { ...a, exact: a.exact.slice(0, 40), suffix: (a.exact.slice(40) + a.suffix).slice(0, 32) });
      if (it) { refreshAnno(); editSticky(it.id, true); }
    }
  };
  placePop(rect);
}

// 線とメモを直す
function editMark(id, fresh = false) {
  const it = findItem(id), el = $("guideBody").querySelector(`mark.hl[data-id="${id}"]`);
  if (!it || !el) return;
  closePop();
  pop.dataset.kind = "mark";
  pop.setAttribute("role", "dialog");
  pop.innerHTML = `<div class="ap-row">${swatches(it.color)}<span class="grow"></span>
      <button data-act="del" title="この線とメモを消す">🗑 消す</button></div>
    <textarea id="annoNote" rows="3" placeholder="メモ（なくてもよい）">${esc(it.note || "")}</textarea>
    <div class="ap-row"><span class="kbd">自動で保存されます</span><span class="grow"></span><button data-act="close">閉じる</button></div>`;
  const note = $("annoNote");
  let t = 0;
  note.oninput = () => {
    it.note = note.value.trim();
    saveAnno();
    clearTimeout(t);
    t = setTimeout(refreshAnno, 500);
  };
  pop.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.color) {
      it.color = b.dataset.color;
      saveAnno();
      refreshAnno();
      pop.querySelectorAll(".sw").forEach((x) => x.classList.toggle("on", x === b));
    } else if (b.dataset.act === "del") {
      pop._onclose = null;
      closePop();
      removeItem(id);
      refreshAnno();
    } else if (b.dataset.act === "close") closePop();
  };
  // メモのボタンで作って、何も書かずに閉じたときは、線も付けない
  pop._onclose = () => {
    clearTimeout(t);
    if (fresh && !it.note) removeItem(id);
    refreshAnno();
  };
  placePop(el.getBoundingClientRect());
  if (fresh || !it.note) note.focus();
}

// 付箋を直す
function editSticky(id, fresh = false) {
  const it = findItem(id), el = $("guideBody").querySelector(`.sticky-bar[data-id="${id}"]`);
  if (!it || !el) return;
  closePop();
  pop.dataset.kind = "sticky";
  pop.setAttribute("role", "dialog");
  pop.innerHTML = `<div class="ap-row"><strong>📌 付箋</strong><span class="grow"></span>
      <button data-act="del" title="この付箋をはがす">🗑 はがす</button></div>
    <input type="text" id="annoLabel" maxlength="60" placeholder="例: ここまで読んだ、ここから試す" value="${esc(it.note || "")}">
    <div class="ap-row">${swatches(it.color)}<span class="grow"></span><button data-act="close" class="primary">OK</button></div>`;
  const label = $("annoLabel");
  label.oninput = () => {
    it.note = label.value.trim();
    saveAnno();
    el.firstElementChild.textContent = "📌 " + (it.note || "付箋");
  };
  label.onkeydown = (e) => { if (e.key === "Enter") closePop(); };
  pop.onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.color) {
      it.color = b.dataset.color;
      saveAnno();
      el.className = "sticky-bar c-" + it.color;
      pop.querySelectorAll(".sw").forEach((x) => x.classList.toggle("on", x === b));
    } else if (b.dataset.act === "del") {
      pop._onclose = null;
      closePop();
      removeItem(id);
      refreshAnno();
    } else if (b.dataset.act === "close") closePop();
  };
  pop._onclose = () => { if (!$("annoPanel").hidden) renderAnnoPanel(); renderTocIfOpen(); };
  placePop(el.getBoundingClientRect());
  if (fresh) label.focus();
}

// ---------- 今見ている所・前に読んでいた所 ----------
// ガイドの欄の上の端に見えている、最初の文字
function topAnchor() {
  const body = $("guideBody"), top = body.getBoundingClientRect().top, idx = textIndex(body);
  for (let k = 0; k < idx.nodes.length; k++) {
    const n = idx.nodes[k];
    if (!n.data.trim()) continue;
    const r = document.createRange();
    r.selectNodeContents(n);
    const rect = r.getBoundingClientRect();
    if (rect.height > 0 && rect.bottom > top + 4) {
      const s = idx.starts[k] + (n.data.length - n.data.trimStart().length);
      return makeAnchor(idx.text, s, Math.min(idx.text.length, s + 40));
    }
  }
  return null;
}
function scrollToEl(el, where = "start") {
  const body = $("guideBody"), br = body.getBoundingClientRect(), r = el.getBoundingClientRect();
  body.scrollTop += r.top - br.top - (where === "center" ? br.height / 3 : 8);
}
function flash(els) {
  els.forEach((el) => { el.classList.remove("anno-flash"); void el.offsetWidth; el.classList.add("anno-flash"); });
}
let posTimer = 0;
$("guideBody").addEventListener("scroll", () => {
  if (pop.dataset.kind === "sel") closePop();
  clearTimeout(posTimer);
  posTimer = setTimeout(() => {
    const a = topAnchor();
    if (a && currentFile()) store.set("pico-studio-pos", JSON.stringify({ file: currentFile(), ...a }));
  }, 600);
});
function restoreReadPos() {
  let pos;
  try { pos = JSON.parse(store.get("pico-studio-pos", "null")); } catch (e) { return; }
  if (!pos || pos.file !== currentFile()) return;
  const body = $("guideBody"), idx = textIndex(body), r = locate(idx, pos);
  if (!r) return;
  const k = nodeAt(idx, r.start);
  if (k < 0) return;
  const n = idx.nodes[k], o = r.start - idx.starts[k];
  const range = document.createRange();
  range.setStart(n, o);
  range.setEnd(n, Math.min(n.data.length, o + 1));
  body.scrollTop += range.getBoundingClientRect().top - body.getBoundingClientRect().top - 8;
}

// ---------- 本文での操作 ----------
// 選び終わりは、押したあと少し待ってから見る（選んだ所の中を押すと、離したあとで選択が消えるため）。

$("guideBody").addEventListener("mouseup", (e) => { const seq = downSeq; setTimeout(() => {

}, 0); });
$("guideBody").addEventListener("click", (e) => {

// ---------- 一覧（🔖） ----------
function pinBadge(file) {
  const n = anno.items.filter((x) => x.file === file && x.type === "sticky").length;
  return n ? `<span class="toc-pin" title="付箋 ${n}枚">📌${n > 1 ? n : ""}</span>` : "";
}
function renderTocIfOpen() { if (!$("tocPanel").hidden) renderToc(); }
function closeAnnoPanel() {
  $("annoPanel").hidden = true;
  $("annoBtn").classList.remove("on");
  $("annoBtn").setAttribute("aria-expanded", "false");
}
function renderAnnoPanel() {
  const panel = $("annoPanel");
  if (!anno.ready) { panel.innerHTML = `<p class="empty">${esc(anno.error || "読み込み中…")}</p>`; return; }
  const order = new Map(guide.chapters.map((c, i) => [c.file, i]));
  const items = [...anno.items].sort((a, b) =>
    (order.get(a.file) ?? 1e9) - (order.get(b.file) ?? 1e9) || a.file.localeCompare(b.file) || (a.pos || 0) - (b.pos || 0));
  const n = (f) => anno.items.filter(f).length;
  const cut = (t, len) => (t.length > len ? t.slice(0, len) + "…" : t).replace(/\s+/g, " ");
  let html = `<div class="ap-top"><button id="annoAddBtn" class="primary">📌 今見ている所に付箋を貼る</button>
      <span class="ap-count">付箋 ${n((x) => x.type === "sticky")}・線 ${n((x) => x.type === "mark")}・メモ ${n((x) => x.type === "mark" && x.note)}</span></div>
    <p class="ap-hint">本文の文字をドラッグして選ぶと、線（4色）・📝 メモ・📌 付箋のボタンが出ます。付けた線や付箋を押すと、色を変えたり消したりできます。</p>`;
  let lastFile = null;
  for (const it of items) {
    if (it.file !== lastFile) {
      lastFile = it.file;
      const ch = guide.chapters[order.get(it.file)];
      html += `<div class="ap-ch">${esc(ch ? ch.title : it.file + "（今はない章）")}</div>`;
    }
    const lost = anno.lost.has(it.id) ? '<small class="lost">本文が変わって、場所が見つかりません</small>' : "";
    const quote = `<small>「${esc(cut(it.exact, 50))}」${fmtDate(it.created)}</small>`;
    const main = it.type === "sticky" ? `📌 ${esc(it.note || "付箋")}`
      : it.note ? `📝 ${esc(cut(it.note, 80))}` : `「${esc(cut(it.exact, 60))}」`;
    html += `<div class="ap-item c-${esc(it.color)}"><button class="ap-go" data-go="${esc(it.id)}"><span class="ap-txt">${main}
      ${it.type === "sticky" || it.note ? quote : `<small>${fmtDate(it.created)}</small>`}${lost}</span></button>
      <button class="ap-del" data-del="${esc(it.id)}" title="消す" aria-label="消す">✕</button></div>`;
  }
  if (!items.length) html += '<p class="empty">まだありません</p>';
  panel.innerHTML = html;
}
$("annoBtn").onclick = () => {
  if (!$("annoPanel").hidden) return closeAnnoPanel();

};
$("annoPanel").addEventListener("click", async (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "annoAddBtn") {
    const a = topAnchor();
    if (!a) return toast("付箋を貼る場所が見つかりません");
    closeAnnoPanel();
    const it = addItem("sticky", a);
    if (it) { refreshAnno(); editSticky(it.id, true); }
    return;
  }

  }
  const it = findItem(b.dataset.go);

  if (idx < 0) return toast("この章は今のガイドにありません。一覧の ✕ で消せます");
  if (idx !== guide.index) await showChapter(idx);

$("guideBtn").onclick = () => setGuideOpen(!$("main").classList.contains("with-guide"));

// ガイドと右側の仕切り（幅は % で持つので、ウィンドウを変えても比率が保たれる）
const GUIDE_MIN = 280, RIGHT_MIN = 564, GUIDE_DEFAULT = 40;
const splitter = $("splitter");

function mainBox() {
  const el = $("main"), cs = getComputedStyle(el), r = el.getBoundingClientRect();
  const left = r.left + parseFloat(cs.paddingLeft);
  return { left, width: r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) };
}
function setGuideWidth(pct, save = true) {
  const { width } = mainBox();
  const min = GUIDE_MIN / width * 100, max = (width - RIGHT_MIN) / width * 100;
  pct = Math.min(Math.max(pct, min), max);
  $("main").style.setProperty("--guide-w", pct.toFixed(2) + "%");
  splitter.setAttribute("aria-valuenow", Math.round(pct));
  if (save) store.set("pico-studio-guide-w", pct.toFixed(2));
  return pct;
}
function guideWidth() {
  return parseFloat($("main").style.getPropertyValue("--guide-w")) || GUIDE_DEFAULT;
}

splitter.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  splitter.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing");
});
splitter.addEventListener("pointermove", (e) => {
  if (!splitter.hasPointerCapture(e.pointerId)) return;
  const { left, width } = mainBox();
  setGuideWidth((e.clientX - 6 - left) / width * 100);
});
const endResize = () => document.body.classList.remove("resizing");
splitter.addEventListener("pointerup", endResize);
splitter.addEventListener("pointercancel", endResize);
splitter.addEventListener("dblclick", () => setGuideWidth(GUIDE_DEFAULT));
splitter.addEventListener("keydown", (e) => {
  const step = { ArrowLeft: -2, ArrowRight: 2 }[e.key];
  if (!step) return;
  e.preventDefault();

});
// コード欄と出力欄の仕切り（コード欄の高さを % で持つ）
const CODE_MIN = 120, CONSOLE_MIN = 120, CODE_DEFAULT = 50;
const hsplitter = $("hsplitter");
function mainBoxV() {
  const el = $("main"), cs = getComputedStyle(el), r = el.getBoundingClientRect();
  const top = r.top + parseFloat(cs.paddingTop);
  return { top, height: r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(cs.rowGap || 12) };
}
function setCodeHeight(pct, save = true) {

  if (height > 0) pct = Math.min(Math.max(pct, CODE_MIN / height * 100), 100 - CONSOLE_MIN / height * 100);
  $("main").style.setProperty("--rows", `minmax(0, ${pct.toFixed(2)}fr) minmax(0, ${(100 - pct).toFixed(2)}fr)`);
  hsplitter.setAttribute("aria-valuenow", Math.round(pct));
  hsplitter.dataset.pct = pct;
  if (save) store.set("pico-studio-code-h", pct.toFixed(2));
}
hsplitter.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  hsplitter.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing-v");
});
hsplitter.addEventListener("pointermove", (e) => {
  if (!hsplitter.hasPointerCapture(e.pointerId)) return;
  const { top, height } = mainBoxV();
  setCodeHeight((e.clientY - 6 - top) / height * 100);
});
const endResizeV = () => document.body.classList.remove("resizing-v");
hsplitter.addEventListener("pointerup", endResizeV);
hsplitter.addEventListener("pointercancel", endResizeV);
hsplitter.addEventListener("dblclick", () => setCodeHeight(CODE_DEFAULT));
hsplitter.addEventListener("keydown", (e) => {
  const step = { ArrowUp: -2, ArrowDown: 2 }[e.key];
  if (!step) return;
  e.preventDefault();
  setCodeHeight((parseFloat(hsplitter.dataset.pct) || CODE_DEFAULT) + step);
});
const savedCodeH = parseFloat(store.get("pico-studio-code-h", ""));
if (savedCodeH > 0) setCodeHeight(savedCodeH, false);

const savedGuideW = parseFloat(store.get("pico-studio-guide-w", ""));
if (savedGuideW > 0) $("main").style.setProperty("--guide-w", savedGuideW + "%");

// =====================================================================
// 関数・引数の説明（コードの単語をクリックすると guide/glossary.json の説明を出す）
// =====================================================================
const tipEl = $("tip");
let glossary = {};
fetch("/guide/glossary.json", { cache: "no-cache" })
  .then((r) => r.json()).then((g) => (glossary = g)).catch(() => {});

// pos の位置にある単語（英数字と _）
function wordAt(text, pos) {
  let s = pos, e = pos;
  while (s > 0 && /\w/.test(text[s - 1])) s--;
  while (e < text.length && /\w/.test(text[e])) e++;
  return s === e ? null : { word: text.slice(s, e), start: s, end: e };
}

// pos を囲んでいる関数呼び出しの名前（例: "train_test_split(" の中なら train_test_split）
function enclosingCall(text, pos) {
  let depth = 0;
  for (let i = pos - 1; i >= 0; i--) {
    const c = text[i];
    if (")]}".includes(c)) depth++;
    else if ("([{".includes(c)) {
      if (depth > 0) { depth--; continue; }
      if (c !== "(") return null;
      const m = text.slice(0, i).match(/([A-Za-z_][\w.]*)\s*$/);
      return m ? m[1] : null;
    }
  }
  return null;
}

// ヘッダーの説明。glossary のキーは "#include <cstdio>" の形（"pico/stdlib.h" のように "" で書くものも <> にそろえる）
function headerTip(name, label) {
  const v = glossary[`#include <${name.trim()}>`];
  return typeof v === "string" ? { label, kind: "ヘッダー", text: v } : null;
}

// #include <cstdio> や #include "pico/stdlib.h" の <…> や "…" の上なら、{ name, label } を返す
function includeAt(text, pos) {
  const start = text.lastIndexOf("\n", pos - 1) + 1;
  const nl = text.indexOf("\n", pos);
  const line = text.slice(start, nl < 0 ? text.length : nl);
  const m = line.match(/^(\s*#\s*include\s*)(<([^>]*)>|"([^"]*)")/);
  if (!m) return null;
  const p = pos - start, s = m[1].length, e = s + m[2].length;
  return p >= s && p <= e ? { name: m[3] ?? m[4], label: "#include " + m[2] } : null;
}

// 単語の説明を探す。引数なら「関数名.引数名」、Pin.OUT のような形なら「Pin.OUT」を先に探す
function lookupAt(text, pos) {
  const inc = includeAt(text, pos);   // ヘッダー名の上なら、単語（stdlib や h）では探さない
  if (inc) return headerTip(inc.name, inc.label);
  const w = wordAt(text, pos);
  if (!w || /^\d/.test(w.word)) return null;
  const isKwarg = /^\s*=(?!=)/.test(text.slice(w.end));
  const fn = isKwarg ? enclosingCall(text, w.start) : null;
  const owner = text.slice(0, w.start).match(/([A-Za-z_]\w*)\.$/);
  const cands = [];
  if (fn) cands.push({ key: fn.split(".").pop() + "." + w.word, kind: "引数", label: `${fn}( ${w.word}= )` });
  if (owner) cands.push({ key: owner[1] + "." + w.word, kind: "", label: owner[1] + "." + w.word });
  cands.push({ key: w.word, kind: fn ? "引数" : /^\s*\(/.test(text.slice(w.end)) ? "関数" : "",
               label: fn ? `${fn}( ${w.word}= )` : w.word });
  for (const c of cands) if (typeof glossary[c.key] === "string") return { ...c, text: glossary[c.key] };
  return null;
}

// コマンドの説明。glossary のキーは "$ apt install" や "$ ls -l" のように $ で始める
// （run や list のような単語が Python の説明と混ざらないように分けている）
function shellKey(t) {
  if (/^\/dev\/ttyACM/.test(t)) return "/dev/ttyACM0";
  if (/\.uf2$/.test(t)) return "*.uf2";
  return t.replace(/(.):$/, "$1");            // 2e8a: → 2e8a
}
function isShellCommand(text) {
  return typeof glossary["$ " + text.trim().split(/\s+/)[0]] === "string";
}
function shellLookup(text, pos) {
  const start = text.lastIndexOf("\n", pos - 1) + 1;
  const nl = text.indexOf("\n", pos);
  const line = text.slice(start, nl < 0 ? text.length : nl), p = pos - start;
  let toks = [...line.matchAll(/"[^"]*"|'[^']*'|\S+/g)].map((m) => ({ t: m[0], s: m.index, e: m.index + m[0].length }));
  const comment = toks.findIndex((x) => x.t.startsWith("#"));
  if (comment >= 0) toks = toks.slice(0, comment);
  const i = toks.findIndex((x) => p >= x.s && p <= x.e);
  if (i < 0) return null;
  const t = toks[i].t;
  if (/^["']/.test(t)) {                             // mpremote exec "..." の中は Python
    const quoted = glossary["$ " + t.slice(1, -1)];  // 文字全体に説明があれば、それを出す
    return lookupAt(text, pos) || (typeof quoted === "string" ? { label: "引用符の中の文字", kind: "", text: quoted } : null);
  }

  let b = i;                                         // | で区切った、今のコマンドの先頭
  while (b > 0 && toks[b - 1].t !== "|") b--;
  if (toks[b].t === "sudo" && b + 1 < toks.length) b++;
  const cmd = toks[b].t, key = shellKey(t), prev = i > b ? toks[i - 1].t : "";
  const cands = [];
  if (i > b) cands.push(`${cmd} ${prev} ${key}`, `${cmd} ${key}`);
  cands.push(key);
  if (t.startsWith(":")) cands.push(":");
  const kind = i === b || t === "sudo" ? "コマンド" : t.startsWith("-") ? "オプション" : "";
  for (const c of cands) {
    const v = glossary["$ " + c];
    if (typeof v === "string") return { label: c.length > key.length ? c : t, kind, text: v };
  }
  return null;
}

// 文の中のコード。説明を出すのはヘッダーだけ（`#include "features.h"`、`<cstdio>`、`model.h`）
function inlineLookup(text, pos) {
  const t = text.trim();
  if (/^#\s*include\b/.test(t)) return lookupAt(text, pos);
  const m = t.match(/^<([^<>\s]+)>$/);
  return headerTip(m ? m[1] : t, t);
}

function showTip(hit, x, y) {
  const m = hit.text.match(/^語源: (.*)\n([\s\S]*)$/);   // 先頭の「語源: 〜」は折りたたんで出す
  tipEl.innerHTML = `<div class="tip-head"><span class="tip-key">${esc(hit.label)}</span>
    ${hit.kind ? `<span class="tip-kind">${hit.kind}</span>` : ""}</div>
    <div class="tip-text">${esc(m ? m[2] : hit.text)}</div>
    ${m ? `<details><summary>語源</summary><div>${esc(m[1])}</div></details>` : ""}`;
  const details = tipEl.querySelector("details");
  if (details) details.addEventListener("toggle", () => {   // 開いて画面の下にはみ出したら、上へずらす
    const b = tipEl.getBoundingClientRect();
    if (b.bottom > innerHeight - 8) tipEl.style.top = Math.max(8, innerHeight - b.height - 8) + "px";
  });
  tipEl.style.display = "block";
  const r = tipEl.getBoundingClientRect();
  const left = Math.max(8, Math.min(x - 20, innerWidth - r.width - 8));
  const top = y + 18 + r.height < innerHeight ? y + 18 : Math.max(8, y - r.height - 12);
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px";
}
function hideTip() { tipEl.style.display = "none"; }

// ガイドのコード
$("guideBody").addEventListener("mouseup", (e) => {
  const codeEl = e.target.closest("code");
  const sel = getSelection();
  if (!codeEl || !sel.rangeCount) return hideTip();
  const r = sel.getRangeAt(0);
  if (!codeEl.contains(r.startContainer)) return hideTip();
  const before = document.createRange();
  before.setStart(codeEl, 0); before.setEnd(r.startContainer, r.startOffset);
  const text = codeEl.textContent, pos = before.toString().length;
  const isBlock = !!codeEl.closest("pre");
  const shell = isBlock ? codeEl.classList.contains("sh") : isShellCommand(text);
  const hit = shell ? shellLookup(text, pos) : isBlock ? lookupAt(text, pos) : inlineLookup(text, pos);
  hit ? showTip(hit, e.clientX, e.clientY) : hideTip();
});
// エディタ
code.addEventListener("mouseup", (e) => {
  const hit = lookupAt(code.value, code.selectionStart);
  hit ? showTip(hit, e.clientX, e.clientY) : hideTip();
});
code.addEventListener("keydown", hideTip);
document.addEventListener("mousedown", (e) => { if (!tipEl.contains(e.target)) hideTip(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
$("guideBody").addEventListener("scroll", hideTip);
code.addEventListener("scroll", hideTip);

// 開発環境の確認（ガイドを開く関数を使うので、最後に呼ぶ）
checkEnv();
