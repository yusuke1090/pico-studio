<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pico Studio</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #d9dde3; --text: #1d2330; --muted: #667085;
  --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f9d55; --warn: #c27c0e; --err: #d64545;
  --code-bg: #fbfbfc; --console-bg: #11151c; --console-text: #d7dde8; --sys: #7aa2f7; --gutter: #98a2b3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --border: #2c3340; --text: #e3e7ee; --muted: #8b95a7;
    --accent: #5b8def; --accent-text: #ffffff; --ok: #3ccf7a; --warn: #e3a33b; --err: #f06a6a;
    --code-bg: #151920; --console-bg: #0c0f14; --console-text: #d7dde8; --sys: #7aa2f7; --gutter: #5b6578;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, "Noto Sans JP", sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0 8px 0 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
select, input[type=text] { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--err); }
main { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: var(--rows, 1fr 1fr);
  grid-template-areas: "side code" "side console"; gap: 12px; padding: 12px 16px;
  height: calc(100vh - 56px); min-height: 520px; }
.side { grid-area: side; } .code-panel { grid-area: code; } .console-panel { grid-area: console; }
/* コード欄と出力欄の間の仕切り。コード欄と同じマスに置き、下の余白（gap）へはみ出させる */
.hsplitter { grid-area: code; align-self: end; height: 12px; margin-bottom: -12px;
  position: relative; z-index: 1; cursor: row-resize; touch-action: none; outline: 0; }
.hsplitter::after { content: ""; position: absolute; top: 50%; left: 50%; width: 48px; height: 4px;
  transform: translate(-50%, -50%); border-radius: 2px; background: var(--border); }
.hsplitter:hover::after, .hsplitter:focus-visible::after, body.resizing-v .hsplitter::after { background: var(--accent); }
body.resizing-v { cursor: row-resize; user-select: none; }
header .spacer { flex: 1; }
header .guide-link { color: var(--accent); text-decoration: none; font-size: 14px; }
header .guide-link:hover { text-decoration: underline; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel h2 { font-size: 13px; margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; }
.panel h2 .grow { flex: 1; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.checks { list-style: none; margin: 0; padding: 10px 12px; display: grid; gap: 8px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks li .dot { margin-top: 6px; flex: none; }
.checks small { color: var(--muted); display: block; overflow-wrap: anywhere; }
#sampleSel { flex: 0 1 220px; min-width: 120px; }
.hint { margin: 0 12px 12px; padding: 8px 10px; border-radius: 6px; background: var(--bg);
  color: var(--muted); font-size: 12px; }
.hint:empty { display: none; }
.hint code { display: block; margin: 6px 0; padding: 4px 6px; border-radius: 4px; background: var(--console-bg);
  color: var(--console-text); font: 12px ui-monospace, "DejaVu Sans Mono", monospace; overflow-wrap: anywhere; }
.hint button { margin-top: 6px; }
.files { list-style: none; margin: 0; padding: 4px 0; overflow: auto; flex: 1; }
.files li { display: flex; align-items: center; gap: 6px; padding: 3px 12px; }
.files li .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.files li .name:hover { color: var(--accent); }
.files li small { color: var(--muted); }
.files li button { padding: 0 6px; font-size: 12px; }
.empty { color: var(--muted); padding: 8px 12px; font-size: 12px; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; }
.toolbar .grow { flex: 1; }
.editor { position: relative; flex: 1; display: flex; min-height: 0; background: var(--code-bg); }
.gutter { padding: 10px 8px 10px 10px; text-align: right; color: var(--gutter); user-select: none;
  font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", monospace; overflow: hidden; white-space: pre; }
textarea#code { flex: 1; border: 0; outline: 0; resize: none; padding: 10px; background: transparent;
  color: var(--text); font: 13px/1.55 ui-monospace, "DejaVu Sans Mono", monospace; tab-size: 4;
  white-space: pre; overflow: auto; }
#console { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; background: var(--console-bg);
  color: var(--console-text); font: 13px/1.5 ui-monospace, "DejaVu Sans Mono", monospace;
  white-space: pre-wrap; word-break: break-all; }
#console .err { color: #ff8b8b; } #console .sys { color: var(--sys); }
.inputrow { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); }
.inputrow input { flex: 1; font-family: ui-monospace, monospace; }
.kbd { color: var(--muted); font-size: 12px; }
#toast { position: fixed; right: 16px; bottom: 16px; max-width: 420px; padding: 10px 14px;
  border-radius: 8px; background: var(--err); color: #fff; display: none; white-space: pre-wrap; }
#toast.ok { background: var(--ok); }

@media (max-width: 1000px) {
  main { grid-template-columns: 1fr; grid-template-rows: none; height: auto;
    grid-template-areas: "side" "code" "console"; }
  .hsplitter { display: none; }
  .editor, #console { min-height: 320px; }
}
</style>
</head>
<body>
<header>
  <h1>Pico Studio</h1>
  <span class="dot" id="connDot"></span><span id="connText">未接続</span>
  <select id="portSel" title="シリアルポート"></select>
  <button id="refreshBtn" title="ポート一覧を更新">更新</button>
  <button id="connectBtn" class="primary">接続</button>
  <button id="disconnectBtn">切断</button>
  <span class="spacer"></span>
  <a class="guide-link" href="https://yusuke1090.github.io/textbooks/?b=pico" target="_blank" rel="noopener" title="ガイド（ラズパイピコ開発ガイド）を教科書のページで開く">📚 ガイド</a>
</header>

<main id="main">
  <div class="side">
    <section class="panel">
      <h2>接続の確認</h2>
      <ul class="checks">
        <li><span class="dot" id="chkUsb"></span><div>USB で認識<small id="chkUsbText">-</small></div></li>
        <li><span class="dot" id="chkConn"></span><div>シリアル接続<small id="chkConnText">-</small></div></li>
        <li><span class="dot" id="chkMp"></span><div>動いているプログラム<small id="chkMpText">-</small></div></li>
        <li><span class="dot" id="chkEnv"></span><div>C++ の開発環境<small id="chkEnvText">-</small></div></li>
      </ul>
      <div class="hint" id="envHint"></div>
      <div class="hint" id="hint"></div>
    </section>
    <section class="panel" style="flex:1">
      <h2><span class="grow" title="MicroPython のときだけ">ピコのファイル</span><button id="filesBtn" title="一覧を更新">更新</button></h2>
      <ul class="files" id="files"><li class="empty">接続すると表示されます</li></ul>
    </section>
  </div>

  <section class="panel code-panel">
    <h2>コード<span class="kbd">（MicroPython で手早く試す。C++ の開発は VS Code で）</span></h2>
    <div class="toolbar">
      <select id="sampleSel">
        <option value="">サンプルを選ぶ…</option>
      </select>
      <span class="grow"></span>
      <button id="runBtn" class="primary" title="Ctrl+Enter">▶ 実行</button>
      <button id="stopBtn" class="danger">■ 停止</button>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter">1</div>
      <textarea id="code" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div class="toolbar">
      <input type="text" id="fileName" value="main.py" size="14" title="保存するときの名前">
      <button id="saveBtn" title="Ctrl+S">ピコに保存</button>
      <span class="kbd">main.py にすると電源を入れたとき自動で動きます</span>
    </div>
  </section>

  <div class="hsplitter" id="hsplitter" role="separator" aria-orientation="horizontal" tabindex="0"
       aria-label="コード欄の高さ" title="ドラッグで高さを変更（ダブルクリックで元に戻す）"></div>
  <section class="panel console-panel">
    <h2><span class="grow">出力</span>
      <button id="resetBtn" title="ピコを再起動（main.py が実行される）">リセット</button>
      <button id="clearBtn">クリア</button></h2>
    <pre id="console"></pre>
    <div class="inputrow">
      <input type="text" id="sendInput" placeholder="ピコに送る（REPL のコマンドや input() への入力）" autocomplete="off">
      <button id="sendBtn">送信</button>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const SAMPLES = {
  "hello: 文字と計算": `print("hello, pico!")
for i in range(1, 6):
    print(i, "x 2 =", i * 2)
`,
  "LED を点滅させる": `# ボードの LED を点滅させる
# 公式ピコは 25 番ピン。ボードによって番号が違うことがある
from machine import Pin
import time

led = Pin(25, Pin.OUT)
for i in range(10):
    led.toggle()
    time.sleep(0.5)
led.off()
print("おわり")
`,
  "RGB LED を光らせる": `# RGB LED（WS2812）を光らせる
# ピン番号はボードによって違う（例: 23, 16）。光らなければ変えてみる
from machine import Pin
import neopixel, time

np = neopixel.NeoPixel(Pin(23), 1)
for color in [(30, 0, 0), (0, 30, 0), (0, 0, 30), (0, 0, 0)]:
    np[0] = color
    np.write()
    time.sleep(0.5)
`,
  "内蔵の温度センサー": `# RP2040 に入っている温度センサーの値を読む
from machine import ADC
import time

sensor = ADC(4)
for i in range(5):
    v = sensor.read_u16() * 3.3 / 65535
    temp = 27 - (v - 0.706) / 0.001721
    print("温度: {:.1f} ℃".format(temp))
    time.sleep(1)
`,
  "PC と送受信する": `# 下の「送信」欄に数字を入れると、2倍にして返す
# 止めるときは「■ 停止」
while True:
    line = input("数字を入力: ")
    try:
        n = float(line)
        print("受信:", n, "→ 2倍:", n * 2)
    except ValueError:
        print("受信した文字:", line)
`,
};

let state = { connected: false, running: false, mode: "python", last: 0, mpOk: null, home: "" };

function toast(msg, ok = false) {
  const t = $("toast");
  t.textContent = msg; t.className = ok ? "ok" : ""; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ok ? 2500 : 7000);
}

async function api(path, body, raw) {
  const opt = body === undefined ? {} : {
    method: "POST",
    headers: raw ? { "Content-Type": "application/octet-stream" } : { "Content-Type": "application/json" },
    body: raw ? body : JSON.stringify(body),
  };
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({ error: "サーバーの応答が読めません" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

function setDot(id, cls) { $(id).className = "dot" + (cls ? " " + cls : ""); }
const tilde = (p) => (state.home && p && p.startsWith(state.home + "/") ? "~" + p.slice(state.home.length) : p);
// サーバーが古いままだと、新しい API が "not found" になる
const OLD_SERVER = "Pico Studio のサーバーが古いままです。ターミナルで Ctrl + C を押して止め、./start.sh で起動し直してください";
const isOldServer = (e) => /not found/i.test(e.message || "");

// ピコで動いているもの（USB の番号でわかる）
const KIND = { micropython: "MicroPython", cpp: "C++ のプログラム", other: "ほかのプログラム" };

// ---------- ポートと接続確認 ----------
async function refreshPorts() {
  let res;
  try { res = await api("/api/ports"); } catch (e) { return toast(e.message); }
  const sel = $("portSel"), prev = sel.value;
  sel.innerHTML = "";
  for (const p of res.ports) {
    const o = document.createElement("option");
    o.value = p.device;
    o.textContent = p.device + (p.is_pico ? `  (ピコ・${KIND[p.kind] || ""})` : p.description ? "  " + p.description : "");
    sel.appendChild(o);
  }
  if (!res.ports.length) {
    const o = document.createElement("option"); o.value = ""; o.textContent = "ポートが見つかりません";
    sel.appendChild(o);
  }
  if (state.port && ![...sel.options].some((o) => o.value === state.port)) {
    const o = document.createElement("option"); o.value = o.textContent = state.port; sel.appendChild(o);
  }
  if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
  if (state.port) sel.value = state.port;

  const pico = res.ports.find((p) => p.is_pico);
  const hint = $("hint");
  let html = "";
  if (res.bootsel.detected) {
    setDot("chkUsb", "warn");
    $("chkUsbText").textContent = "BOOTSEL モード（書き込み待ち）";
    html = res.bootsel.mount
      ? `ピコが書き込みモードになっています。MicroPython か、VS Code でビルドした .uf2 を書き込めます。<br>
         <button id="flashLatestBtn" class="primary">最新の MicroPython を書き込む</button>
         <button id="flashFileBtn">.uf2 ファイルを選ぶ</button>
         <input type="file" id="uf2File" accept=".uf2" hidden>`
      : "ピコが書き込みモードで見えていますが、ドライブがまだ開かれていません。ファイルマネージャーで「RPI-RP2」を開いてから「更新」を押してください。";
  } else if (pico || state.connected) {
    setDot("chkUsb", "ok");
    $("chkUsbText").textContent = (pico ? `${pico.device} で認識（${KIND[pico.kind] || "?"}）` : state.port + " で認識");
  } else if (res.ports.length) {
    setDot("chkUsb", "warn");
    $("chkUsbText").textContent = "ピコではないシリアル機器があります";
  } else {
    setDot("chkUsb", "err");
    $("chkUsbText").textContent = "見つかりません";
    html = `ピコが見つかりません。<br>
      ・USB ケーブルがデータ通信に対応しているか<br>
      ・BOOT ボタンを押しながらつなぐと「RPI-RP2」が出るか<br>
      ・USB を使わない C++ のプログラムが動いていないか<br>を確認してください。`;
  }
  if (hint.dataset.src !== html) {
    hint.dataset.src = html;
    hint.innerHTML = html;
    bindFlash();
  }
}

function bindFlash() {
  const latest = $("flashLatestBtn"), pick = $("flashFileBtn"), file = $("uf2File");
  if (latest) latest.onclick = async () => {
    latest.disabled = true; latest.textContent = "ダウンロードして書き込み中…";
    try {
      const r = await api("/api/flash-latest", {});
      toast("書き込みました。ピコが再起動するので、数秒後に「更新」を押してください。\n" + r.url, true);
      setTimeout(refreshPorts, 4000);
    } catch (e) { toast(e.message); latest.disabled = false; latest.textContent = "最新の MicroPython を書き込む"; }
  };
  if (pick) pick.onclick = () => file.click();
  if (file) file.onchange = async () => {
    if (!file.files[0]) return;
    try {
      await api("/api/flash", await file.files[0].arrayBuffer(), true);
      toast("書き込みました。数秒後に「更新」を押してください。", true);
      setTimeout(refreshPorts, 4000);
    } catch (e) { toast(e.message); }
  };
}

// 3つ目の確認: つないだピコで何が動いているか
async function checkProgram() {
  if (!state.connected) { setDot("chkMp", ""); $("chkMpText").textContent = "-"; return; }
  $("chkMpText").style.whiteSpace = "pre-line";
  if (state.mode === "cpp") {
    setDot("chkMp", "ok");
    $("chkMpText").textContent = "C++ のプログラムが動いています。printf の出力を下に表示します\n（MicroPython は入っていません）";
    renderFiles(null, "C++ のプログラムでは、ピコの中にファイルはありません");
    return;
  }
  setDot("chkMp", ""); $("chkMpText").textContent = "確認中…";
  try {
    const i = await api("/api/info");
    state.mpOk = true;
    setDot("chkMp", "ok");
    const kb = (n) => Math.round(n / 1024) + " KB";
    $("chkMpText").textContent =
      `MicroPython ${i.version}\n${i.machine}\nストレージ空き ${kb(i.flash_free)} / ${kb(i.flash_total)}・メモリ空き ${kb(i.mem_free)}`;
    loadFiles();
  } catch (e) {
    state.mpOk = false;
    setDot("chkMp", "err");
    $("chkMpText").textContent = e.message;
  }
}

// 4つ目の確認: C++ の開発環境（VS Code の拡張機能・SDK・コンパイラ・picotool）
async function checkEnv() {
  setDot("chkEnv", ""); $("chkEnvText").textContent = "確認中…";
  try {
    const e = await api("/api/env");
    state.home = e.home;
    const mark = (ok) => (ok ? "✓" : "✗");
    const it = e.items;
    $("chkEnvText").style.whiteSpace = "pre-line";
    $("chkEnvText").textContent = [
      `${mark(it.vscode)} VS Code の拡張機能${it.vscode ? "（" + it.vscode + "）" : ""}`,
      `${mark(it.sdk)} Pico SDK${it.sdk ? " " + (e.sdk_version || "") + "（" + tilde(it.sdk) + "）" : ""}`,
      `${mark(it.compiler)} コンパイラ`,
      `${mark(it.picotool)} picotool`,
    ].join("\n");
    setDot("chkEnv", it.vscode && it.sdk && it.compiler ? "ok" : it.vscode || it.sdk ? "warn" : "err");
    $("envHint").innerHTML = it.vscode ? "" :
      `C++ の開発には VS Code の拡張機能「Raspberry Pi Pico」を使います。<br><button id="envDoc">入れ方を見る（2章）</button>`;
    if ($("envDoc")) $("envDoc").onclick = () => window.open("https://yusuke1090.github.io/textbooks/?b=pico#ch=2", "_blank", "noopener");
    if (it.vscode && !it.sdk) $("chkEnvText").textContent += "\nVS Code で最初のプロジェクトを作ると、SDK などが入ります（3章）";
  } catch (err) {
    setDot("chkEnv", "err");
    $("chkEnvText").textContent = isOldServer(err) ? OLD_SERVER : err.message;
  }
}

// ---------- 状態のポーリング ----------
const consoleEl = $("console");
function appendConsole(items) {
  if (!items.length) return;
  const atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 40;
  for (const it of items) {
    const last = consoleEl.lastChild;
    const text = it.text.replace(/\r\n/g, "\n").replace(/\r/g, "");
    if (last && last.dataset && last.dataset.kind === it.kind) last.textContent += text;
    else {
      const s = document.createElement("span");
      s.dataset.kind = it.kind; s.className = it.kind; s.textContent = text;
      consoleEl.appendChild(s);
    }
  }
  if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
}

async function poll() {
  try {
    const s = await api("/api/state?since=" + state.last);
    appendConsole(s.console);
    state.last = s.last;
    const changed = s.connected !== state.connected || s.mode !== state.mode;
    state.connected = s.connected; state.running = s.running; state.port = s.port; state.mode = s.mode;
    updateUi();
    if (changed) {
      if (s.connected) setTimeout(checkProgram, 400);
      else { state.mpOk = null; checkProgram(); renderFiles(null); }
      refreshPorts();
    }
  } catch (e) {
    $("connText").textContent = "サーバーに接続できません";
    setDot("connDot", "err");
  }
  setTimeout(poll, state.running ? 150 : 400);
}

function updateUi() {
  const c = state.connected, r = state.running, py = state.mode === "python";
  setDot("connDot", c ? (r ? "warn" : "ok") : "");
  $("connText").textContent = c ? (r ? "実行中" : py ? "接続中" : "C++ の出力を表示中") + "（" + state.port + "）" : "未接続";
  setDot("chkConn", c ? "ok" : "");
  $("chkConnText").textContent = c ? state.port : "-";
  $("connectBtn").disabled = c;
  $("disconnectBtn").disabled = !c;
  $("portSel").disabled = c;
  $("runBtn").disabled = !c || r || !py;
  $("stopBtn").disabled = !c || !py;
  $("saveBtn").disabled = !c || r || !py;
  $("resetBtn").disabled = !c || r || !py;
  $("filesBtn").disabled = !c || r || !py;
  $("sendBtn").disabled = !c;
}

// ---------- ファイル ----------
async function loadFiles() {
  try { renderFiles((await api("/api/files")).files); } catch (e) { toast(e.message); }
}
function renderFiles(files, message = "接続すると表示されます") {
  const ul = $("files"); ul.innerHTML = "";
  if (!files) { ul.innerHTML = `<li class="empty">${esc(message)}</li>`; return; }
  if (!files.length) { ul.innerHTML = '<li class="empty">ファイルはありません</li>'; return; }
  for (const f of files) {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.className = "name"; name.textContent = (f.dir ? "📁 " : "") + f.name.replace(/^\//, "");
    li.appendChild(name);
    if (!f.dir) {
      name.title = "開く";
      name.onclick = () => openFile(f.name);
      const sz = document.createElement("small"); sz.textContent = f.size + "B"; li.appendChild(sz);
      const del = document.createElement("button"); del.textContent = "削除"; del.className = "danger";
      del.onclick = () => deleteFile(f.name); li.appendChild(del);
    }
    ul.appendChild(li);
  }
}
async function openFile(name) {
  if (state.running) return toast("実行中は開けません。停止してください。");
  try {
    const r = await api("/api/file?name=" + encodeURIComponent(name));
    replaceCode(r.content); $("fileName").value = name.replace(/^\//, "");
  } catch (e) { toast(e.message); }
}
async function deleteFile(name) {
  if (!confirm(name + " を削除しますか？")) return;
  try { await api("/api/delete", { name }); loadFiles(); } catch (e) { toast(e.message); }
}

// ---------- エディタ（MicroPython） ----------
const code = $("code"), gutter = $("gutter");
function onCodeChange() {
  const n = code.value.split("\n").length;
  gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n");
  try { localStorage.setItem("pico-studio-code", code.value); } catch (e) {}
}
code.addEventListener("input", onCodeChange);
code.addEventListener("scroll", () => (gutter.scrollTop = code.scrollTop));
code.addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const s = code.selectionStart, en = code.selectionEnd;
    if (s === en && !e.shiftKey) {
      code.setRangeText("    ", s, en, "end");
    } else {
      const ls = code.value.lastIndexOf("\n", s - 1) + 1;
      const block = code.value.slice(ls, en);
      const out = e.shiftKey ? block.replace(/^ {1,4}/gm, "") : block.replace(/^/gm, "    ");
      code.setRangeText(out, ls, en, "select");
    }
    onCodeChange();
  } else if (e.key === "Enter" && !e.ctrlKey && !e.metaKey) {
    // 自動インデント
    e.preventDefault();
    const s = code.selectionStart;
    const line = code.value.slice(code.value.lastIndexOf("\n", s - 1) + 1, s);
    let indent = line.match(/^\s*/)[0];
    if (/:\s*$/.test(line)) indent += "    ";
    code.setRangeText("\n" + indent, s, code.selectionEnd, "end");
    onCodeChange();
  }
});
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
});

// コード欄を置き換える。確認は出さず、Ctrl + Z で前のコードに戻せるようにする
function replaceCode(text) {
  code.focus();
  code.select();
  if (!document.execCommand("insertText", false, text)) code.value = text;   // 使えないブラウザでは、そのまま入れる
  code.setSelectionRange(0, 0);
  code.scrollTop = 0;
  onCodeChange();
}
for (const k of Object.keys(SAMPLES)) {
  const o = document.createElement("option"); o.value = k; o.textContent = k; $("sampleSel").appendChild(o);
}
$("sampleSel").onchange = (e) => {
  const k = e.target.value; if (!k) return;
  replaceCode(SAMPLES[k]); e.target.value = "";
};

// ---------- 操作 ----------
async function run() {
  if (!state.connected || state.running || state.mode !== "python") return;
  try { await api("/api/run", { code: code.value }); state.running = true; updateUi(); } catch (e) { toast(e.message); }
}
async function save() {
  const name = $("fileName").value.trim();
  if (!name) return toast("ファイル名を入れてください");
  if (!state.connected) return toast("ピコに接続してください");
  try { await api("/api/file", { name, content: code.value }); toast(name + " をピコに保存しました", true); loadFiles(); }
  catch (e) { toast(e.message); }
}
async function send() {
  const v = $("sendInput").value;
  try { await api("/api/send", { text: v }); $("sendInput").value = ""; } catch (e) { toast(e.message); }
}

$("refreshBtn").onclick = () => { refreshPorts(); checkEnv(); };
$("connectBtn").onclick = async () => {
  const port = $("portSel").value;
  if (!port) return toast("ポートが選ばれていません。ピコをつないで「更新」を押してください。");
  try { await api("/api/connect", { port }); } catch (e) { toast(e.message); }
};
$("disconnectBtn").onclick = () => api("/api/disconnect", {}).catch((e) => toast(e.message));
$("runBtn").onclick = run;
$("stopBtn").onclick = () => api("/api/stop", {}).catch((e) => toast(e.message));
$("saveBtn").onclick = save;
$("resetBtn").onclick = () => api("/api/reset", {}).catch((e) => toast(e.message));
$("clearBtn").onclick = () => { consoleEl.innerHTML = ""; api("/api/clear", {}).catch(() => {}); };
$("filesBtn").onclick = loadFiles;
$("sendBtn").onclick = send;
$("sendInput").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

try { code.value = localStorage.getItem("pico-studio-code") || SAMPLES["hello: 文字と計算"]; }
catch (e) { code.value = SAMPLES["hello: 文字と計算"]; }
onCodeChange();
updateUi();
refreshPorts();
setInterval(() => { if (!state.connected) refreshPorts(); }, 3000);
poll();

// このブラウザに保存する（コード欄の高さなど）
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// コード欄と出力欄の仕切り（コード欄の高さを % で持つ）
const CODE_MIN = 120, CONSOLE_MIN = 120, CODE_DEFAULT = 50;
const hsplitter = $("hsplitter");
function mainBoxV() {
  const el = $("main"), cs = getComputedStyle(el), r = el.getBoundingClientRect();
  const top = r.top + parseFloat(cs.paddingTop);
  return { top, height: r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - parseFloat(cs.rowGap || 12) };
}
function setCodeHeight(pct, save = true) {
  const { height } = mainBoxV();
  if (height > 0) pct = Math.min(Math.max(pct, CODE_MIN / height * 100), 100 - CONSOLE_MIN / height * 100);
  $("main").style.setProperty("--rows", `minmax(0, ${pct.toFixed(2)}fr) minmax(0, ${(100 - pct).toFixed(2)}fr)`);
  hsplitter.setAttribute("aria-valuenow", Math.round(pct));
  hsplitter.dataset.pct = pct;
  if (save) store.set("pico-studio-code-h", pct.toFixed(2));
}
hsplitter.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  hsplitter.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing-v");
});
hsplitter.addEventListener("pointermove", (e) => {
  if (!hsplitter.hasPointerCapture(e.pointerId)) return;
  const { top, height } = mainBoxV();
  setCodeHeight((e.clientY - 6 - top) / height * 100);
});
const endResizeV = () => document.body.classList.remove("resizing-v");
hsplitter.addEventListener("pointerup", endResizeV);
hsplitter.addEventListener("pointercancel", endResizeV);
hsplitter.addEventListener("dblclick", () => setCodeHeight(CODE_DEFAULT));
hsplitter.addEventListener("keydown", (e) => {
  const step = { ArrowUp: -2, ArrowDown: 2 }[e.key];
  if (!step) return;
  e.preventDefault();
  setCodeHeight((parseFloat(hsplitter.dataset.pct) || CODE_DEFAULT) + step);
});
const savedCodeH = parseFloat(store.get("pico-studio-code-h", ""));
if (savedCodeH > 0) setCodeHeight(savedCodeH, false);

// 開発環境の確認
checkEnv();
</script>
</body>
