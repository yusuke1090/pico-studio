<circle cx="415" cy="240" r="3.5" fill="#e07b00"/>
<text x="514" y="246" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">RP2040</text>
<text x="514" y="263" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">ボードの頭脳（マイコン）</text>
<text x="380" y="428" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">ボタンや LED の位置・つながっているピンはボードによって違います。ボードの印字や説明書で確認してください。</text>
