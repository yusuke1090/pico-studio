<text x="417" y="184" font-size="9" text-anchor="middle" font-weight="400" fill="#ffffff">RGB</text>
<line x1="307" y1="98" x2="252" y2="98" stroke="#e07b00" stroke-width="2" stroke-linecap="round"/>
