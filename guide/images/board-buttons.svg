<text x="246" y="94" font-size="13" text-anchor="end" font-weight="700" fill="#2b2f36">BOOT（ブート）</text>
<text x="246" y="111" font-size="13" text-anchor="end" font-weight="400" fill="#2b2f36">押しながら起動すると</text>
<text x="246" y="128" font-size="13" text-anchor="end" font-weight="400" fill="#2b2f36">書き込みモードになる</text>
<line x1="330" y1="164" x2="252" y2="190" stroke="#e07b00" stroke-width="2" stroke-linecap="round"/>
<circle cx="330" cy="164" r="3.5" fill="#e07b00"/>
<text x="246" y="186" font-size="13" text-anchor="end" font-weight="700" fill="#2b2f36">LED（GP25）</text>
<text x="246" y="203" font-size="13" text-anchor="end" font-weight="400" fill="#2b2f36">プログラムで点けたり</text>
<text x="246" y="220" font-size="13" text-anchor="end" font-weight="400" fill="#2b2f36">消したりできる</text>
<line x1="350" y1="318" x2="252" y2="318" stroke="#e07b00" stroke-width="2" stroke-linecap="round"/>
<circle cx="350" cy="318" r="3.5" fill="#e07b00"/>
<text x="246" y="314" font-size="13" text-anchor="end" font-weight="700" fill="#2b2f36">USR（ユーザーボタン）</text>
<text x="246" y="331" font-size="13" text-anchor="end" font-weight="400" fill="#2b2f36">自分のプログラムで使う</text>
<text x="246" y="348" font-size="13" text-anchor="end" font-weight="400" fill="#2b2f36">（多くは GP24）</text>
