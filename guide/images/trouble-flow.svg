<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-1f7a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a3d"/></marker><marker id="ah-c0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-c28a00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c28a00"/></marker><marker id="ah-555c66" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555c66"/></marker><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker><marker id="ah-6b3fa0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fa0"/></marker></defs>
<rect width="820" height="520" rx="10" fill="#ffffff"/>
<text x="410.0" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">VS Code で書き込めないときの調べ方</text>
<rect x="260" y="50" width="300" height="54" rx="8" fill="#e8f0fd" stroke="#2f6fde" stroke-width="2"/>
<text x="410.0" y="72" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6fde">Run Project (USB) で書き込めない</text>
<path d="M410 104 L410 128" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<rect x="230" y="130" width="360" height="66" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="410.0" y="152" font-size="14" text-anchor="middle" font-weight="700" fill="#555c66">Pico Studio の「USB で認識」は？</text>
<text x="410.0" y="174" font-size="12" text-anchor="middle" fill="#555c66">（「更新」を押してから見る。5章）</text>
<path d="M300 196 L120 250" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="180" y="218" font-size="11" text-anchor="middle" fill="#2f6fde">見つかりません</text>
<path d="M410 196 L410 250" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="470" y="228" font-size="11" text-anchor="middle" fill="#2f6fde">（MicroPython）</text>
<path d="M520 196 L700 250" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="650" y="218" font-size="11" text-anchor="middle" fill="#2f6fde">（C++ のプログラム）</text>
<rect x="20" y="252" width="230" height="92" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="135.0" y="274" font-size="14" text-anchor="middle" font-weight="700" fill="#c28a00">BOOT を押しながらつなぐ</text>
<text x="135.0" y="296" font-size="12" text-anchor="middle" fill="#555c66">「BOOTSEL モード」と出る？</text>
<rect x="300" y="252" width="220" height="92" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="410.0" y="274" font-size="14" text-anchor="middle" font-weight="700" fill="#1f7a3d">BOOT を押しながら</text>
<text x="410.0" y="296" font-size="12" text-anchor="middle" fill="#555c66">つなぎ直してから</text>
<text x="410.0" y="314" font-size="12" text-anchor="middle" fill="#555c66">Run を押す（3章）</text>
<rect x="570" y="252" width="230" height="92" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="685.0" y="274" font-size="14" text-anchor="middle" font-weight="700" fill="#c28a00">エラーの言葉は？</text>
<text x="685.0" y="296" font-size="12" text-anchor="middle" fill="#555c66">VS Code の下のターミナル</text>
<text x="685.0" y="314" font-size="12" text-anchor="middle" fill="#555c66">に出ている</text>
<path d="M80 344 L80 400" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="52" y="376" font-size="11" text-anchor="middle" fill="#2f6fde">出ない</text>
<path d="M200 344 L200 400" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="222" y="376" font-size="11" text-anchor="middle" fill="#2f6fde">出る</text>
<rect x="20" y="402" width="120" height="96" rx="8" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
<text x="80.0" y="424" font-size="13" text-anchor="middle" font-weight="700" fill="#c0392b">ケーブル・</text>
<text x="80.0" y="446" font-size="11" text-anchor="middle" fill="#555c66">USB ポートを</text>
<text x="80.0" y="463" font-size="11" text-anchor="middle" fill="#555c66">替える</text>
<text x="80.0" y="480" font-size="11" text-anchor="middle" fill="#555c66">ハブを外す</text>
<rect x="150" y="402" width="120" height="96" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="210.0" y="424" font-size="13" text-anchor="middle" font-weight="700" fill="#1f7a3d">そのまま</text>
<text x="210.0" y="446" font-size="11" text-anchor="middle" fill="#555c66">Run を押す</text>
<text x="210.0" y="463" font-size="11" text-anchor="middle" fill="#555c66">（書き込み</text>
<text x="210.0" y="480" font-size="11" text-anchor="middle" fill="#555c66">モードで待っている）</text>
<path d="M620 344 L560 400" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="548" y="372" font-size="11" text-anchor="middle" fill="#2f6fde">ACCESS・権限</text>
<path d="M750 344 L720 400" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="770" y="372" font-size="11" text-anchor="middle" fill="#2f6fde">使用中・busy</text>
<rect x="470" y="402" width="170" height="96" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="555.0" y="424" font-size="13" text-anchor="middle" font-weight="700" fill="#6b3fa0">udev ルール</text>
<text x="555.0" y="446" font-size="11" text-anchor="middle" fill="#555c66">2章の手順3を行い、</text>
<text x="555.0" y="463" font-size="11" text-anchor="middle" fill="#555c66">ピコを抜き差し</text>
<rect x="650" y="402" width="150" height="96" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="725.0" y="424" font-size="13" text-anchor="middle" font-weight="700" fill="#6b3fa0">ポートを空ける</text>
<text x="725.0" y="446" font-size="11" text-anchor="middle" fill="#555c66">Serial Monitor を止める</text>
<text x="725.0" y="463" font-size="11" text-anchor="middle" fill="#555c66">Pico Studio を切断</text>
</svg>
