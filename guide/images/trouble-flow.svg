<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-1f7a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a3d"/></marker><marker id="ah-8a919c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a919c"/></marker><marker id="ah-d93a3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d93a3a"/></marker><marker id="ah-e07b00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07b00"/></marker></defs>
<rect width="760" height="420" rx="10" fill="#ffffff"/>
<text x="380" y="26" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">つながらないときの調べ方</text>
<rect x="250" y="42" width="260" height="44" rx="8" fill="#fde8e8" stroke="#d93a3a" stroke-width="2"/>
<text x="380.0" y="68.2" font-size="14" text-anchor="middle" font-weight="700" fill="#2b2f36">Pico Studio でピコにつながらない</text>
<line x1="380" y1="88" x2="380" y2="106" stroke="#8a919c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="230" y="110" width="300" height="50" rx="8" fill="#eef4ff" stroke="#2f6fde" stroke-width="2"/>
<text x="380.0" y="131.2" font-size="14" text-anchor="middle" font-weight="700" fill="#2b2f36">ポート欄に「(ピコ)」が出る？</text>
<text x="380.0" y="151.0" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">「更新」を押してから見る</text>
<path d="M230 135 L160 135 L160 182" stroke="#d93a3a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-d93a3a)"/>
<text x="196" y="128" font-size="12" text-anchor="middle" font-weight="700" fill="#d93a3a">出ない</text>
<path d="M530 135 L600 135 L600 182" stroke="#1f7a3d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-1f7a3d)"/>
<text x="566" y="128" font-size="12" text-anchor="middle" font-weight="700" fill="#1f7a3d">出る</text>
<rect x="20" y="186" width="280" height="60" rx="8" fill="#eef4ff" stroke="#2f6fde" stroke-width="2"/>
<text x="160.0" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">BOOT を押しながらつなぐと</text>
<text x="160.0" y="231.9" font-size="13" text-anchor="middle" font-weight="400" fill="#555c66">「BOOTSEL モード」と出る？</text>
<rect x="460" y="186" width="280" height="60" rx="8" fill="#eef4ff" stroke="#2f6fde" stroke-width="2"/>
<text x="600.0" y="210.5" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">「接続」を押すと</text>
<text x="600.0" y="231.9" font-size="13" text-anchor="middle" font-weight="400" fill="#555c66">どんなメッセージが出る？</text>
<path d="M95 248 L95 290" stroke="#d93a3a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-d93a3a)"/>
<text x="85" y="274" font-size="12" text-anchor="end" font-weight="700" fill="#d93a3a">出ない</text>
<path d="M275 248 L275 290" stroke="#1f7a3d" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-1f7a3d)"/>
<text x="285" y="274" font-size="12" text-anchor="start" font-weight="700" fill="#1f7a3d">出る</text>
<path d="M485 248 L485 290" stroke="#e07b00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-e07b00)"/>
<text x="475" y="274" font-size="12" text-anchor="end" font-weight="700" fill="#e07b00">権限がありません</text>
<path d="M665 248 L665 290" stroke="#e07b00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-e07b00)"/>
<text x="655" y="274" font-size="12" text-anchor="end" font-weight="700" fill="#e07b00">応答がありません</text>
<rect x="10" y="294" width="170" height="86" rx="8" fill="#fff6e0" stroke="#e0a800" stroke-width="2"/>
<text x="95.0" y="317.0" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">ケーブルを替える</text>
<text x="95.0" y="336.2" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">充電専用のケーブルは使えない</text>
<text x="95.0" y="352.2" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">USB ポートを替える</text>
<text x="95.0" y="368.1" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">USB ハブを外す</text>
<rect x="190" y="294" width="170" height="86" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="275.0" y="324.9" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">MicroPython を書き込む</text>
<text x="275.0" y="344.2" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">「最新の MicroPython を</text>
<text x="275.0" y="360.1" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">書き込む」ボタン（3章）</text>
<rect x="400" y="294" width="170" height="86" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="485.0" y="324.9" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">権限を設定する</text>
<text x="485.0" y="344.2" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">0章「ポートを開く権限が</text>
<text x="485.0" y="360.1" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">ありません」と出たとき</text>
<rect x="580" y="294" width="170" height="86" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="665.0" y="324.9" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">ほかのソフトを閉じる</text>
<text x="665.0" y="344.2" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">Thonny などを閉じる</text>
<text x="665.0" y="360.1" font-size="11" text-anchor="middle" font-weight="400" fill="#555c66">「■ 停止」・RST を押す</text>
<text x="380" y="406" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">それでもだめなら、このあとの表とコマンドでの確認を見てください。</text>
</svg>
