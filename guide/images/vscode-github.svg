<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-c0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker><marker id="ah-6b3fa0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fa0"/></marker><marker id="ah-555c66" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555c66"/></marker><marker id="ah-c28a00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c28a00"/></marker><marker id="ah-1f7a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a3d"/></marker></defs>
<rect width="820" height="400" rx="10" fill="#ffffff"/>
<text x="410.0" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">開発するフォルダと GitHub</text>
<rect x="20" y="55" width="180" height="110" rx="8" fill="#e8f0fd" stroke="#2f6fde" stroke-width="2"/>
<text x="110.0" y="77" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6fde">① VS Code で作る</text>
<text x="110.0" y="99" font-size="12" text-anchor="middle" fill="#555c66">New C/C++ Project</text>
<text x="110.0" y="117" font-size="12" text-anchor="middle" fill="#555c66">Location: ~/apps</text>
<text x="110.0" y="135" font-size="12" text-anchor="middle" fill="#555c66">→ ~/apps/collar ができる</text>
<path d="M200 110 L218 110" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<rect x="220" y="55" width="180" height="110" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="310.0" y="77" font-size="14" text-anchor="middle" font-weight="700" fill="#6b3fa0">② GitHub に置く</text>
<text x="310.0" y="99" font-size="12" text-anchor="middle" fill="#555c66">ソース管理の</text>
<text x="310.0" y="117" font-size="12" text-anchor="middle" fill="#555c66">Publish to GitHub</text>
<text x="310.0" y="135" font-size="12" text-anchor="middle" fill="#555c66">（最初の1回だけ）</text>
<path d="M400 110 L418 110" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<rect x="420" y="55" width="180" height="110" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="510.0" y="77" font-size="14" text-anchor="middle" font-weight="700" fill="#c28a00">③ 開発する</text>
<text x="510.0" y="99" font-size="12" text-anchor="middle" fill="#555c66">書く → Compile</text>
<text x="510.0" y="117" font-size="12" text-anchor="middle" fill="#555c66">→ Run (USB)</text>
<text x="510.0" y="135" font-size="12" text-anchor="middle" fill="#555c66">→ 出力を見る</text>
<path d="M600 110 L618 110" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<rect x="620" y="55" width="180" height="110" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="710.0" y="77" font-size="14" text-anchor="middle" font-weight="700" fill="#1f7a3d">④ 記録する</text>
<text x="710.0" y="99" font-size="12" text-anchor="middle" fill="#555c66">動いたらコミット</text>
<text x="710.0" y="117" font-size="12" text-anchor="middle" fill="#555c66">→ プッシュ</text>
<text x="710.0" y="135" font-size="12" text-anchor="middle" fill="#555c66">（ソース管理）</text>
<path d="M710 165 L710 195 L510 195 L510 169" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah-c0392b)"/>
<text x="610" y="212" font-size="12" text-anchor="middle" font-weight="700" fill="#c0392b">くり返す</text>
<rect x="20" y="240" width="360" height="120" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="200.0" y="262" font-size="14" text-anchor="middle" font-weight="700" fill="#555c66">PC の中: ~/apps/collar</text>
<text x="200.0" y="284" font-size="12" text-anchor="middle" fill="#555c66">CMakeLists.txt・collar.cpp・.vscode/</text>
<text x="200.0" y="302" font-size="12" text-anchor="middle" fill="#555c66">→ GitHub に上げる</text>
<text x="200.0" y="320" font-size="12" text-anchor="middle" fill="#555c66">build/ → 上げない（.gitignore）</text>
<rect x="440" y="240" width="360" height="120" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="620.0" y="262" font-size="14" text-anchor="middle" font-weight="700" fill="#6b3fa0">GitHub: ユーザー名/collar（非公開）</text>
<text x="620.0" y="284" font-size="12" text-anchor="middle" fill="#555c66">コードの保管と、これまでの記録</text>
<text x="620.0" y="302" font-size="12" text-anchor="middle" fill="#555c66">別の PC では git clone して</text>
<text x="620.0" y="320" font-size="12" text-anchor="middle" fill="#555c66">VS Code で開けば、続きから開発できる</text>
<path d="M380 285 L438 285" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-6b3fa0)"/>
<text x="409" y="278" font-size="11" text-anchor="middle" fill="#6b3fa0">push</text>
<path d="M438 320 L382 320" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-6b3fa0)"/>
<text x="409" y="340" font-size="11" text-anchor="middle" fill="#6b3fa0">clone・pull</text>
<text x="410" y="388" font-size="12" text-anchor="middle" fill="#555c66">1つの製品（プログラム）＝ 1つのプロジェクト ＝ ~/apps の中の1つのフォルダ ＝ 1つのリポジトリ</text>
</svg>
