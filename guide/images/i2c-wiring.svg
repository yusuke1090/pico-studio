<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
  <rect width="760" height="396" rx="10" fill="#ffffff"/>
  <!-- Pico -->
  <rect x="30" y="40" width="170" height="300" rx="8" fill="#1f7a3d"/>
  <rect x="88" y="26" width="54" height="22" rx="3" fill="#b8bec7"/>
  <text x="115" y="290" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Raspberry Pi</text>
  <text x="115" y="310" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Pico</text>
  <rect x="80" y="225" width="70" height="40" rx="3" fill="#2b2f36"/>
  <text x="115" y="250" text-anchor="middle" fill="#cfd3da" font-size="11">RP2040</text>
  <g fill="#ffffff" font-size="12" text-anchor="end">
    <text x="190" y="84">3V3(OUT) 36番</text>
    <text x="190" y="124">GND 38番</text>
    <text x="190" y="164">GP4 SDA 6番</text>
    <text x="190" y="204">GP5 SCL 7番</text>
  </g>
  <!-- buses -->
  <g stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M200 80 H720" stroke="#d93a3a"/>
    <path d="M200 120 H720" stroke="#2b2f36"/>
    <path d="M200 160 H720" stroke="#2f6fde"/>
    <path d="M200 200 H720" stroke="#e0a800"/>
  </g>
  <g font-size="12" font-weight="700">
    <text x="726" y="84" fill="#d93a3a">3.3V</text>
    <text x="726" y="124" fill="#2b2f36">GND</text>
    <text x="726" y="164" fill="#2f6fde">SDA</text>
    <text x="726" y="204" fill="#b38600">SCL</text>
  </g>
  <!-- drops: MPU-6050 pins x=350(VCC) 390(GND) 430(SCL) 470(SDA) -->
  <g stroke-width="3" fill="none">
    <path d="M350 80 V270" stroke="#d93a3a"/>
    <path d="M390 120 V270" stroke="#2b2f36"/>
    <path d="M430 200 V270" stroke="#e0a800"/>
    <path d="M470 160 V270" stroke="#2f6fde"/>
    <path d="M580 80 V270" stroke="#d93a3a"/>
    <path d="M620 120 V270" stroke="#2b2f36"/>
    <path d="M660 200 V270" stroke="#e0a800"/>
    <path d="M700 160 V270" stroke="#2f6fde"/>
  </g>
  <g>
    <circle cx="350" cy="80" r="6" fill="#d93a3a"/>
    <circle cx="390" cy="120" r="6" fill="#2b2f36"/>
    <circle cx="430" cy="200" r="6" fill="#e0a800"/>
    <circle cx="470" cy="160" r="6" fill="#2f6fde"/>
    <circle cx="580" cy="80" r="6" fill="#d93a3a"/>
    <circle cx="620" cy="120" r="6" fill="#2b2f36"/>
    <circle cx="660" cy="200" r="6" fill="#e0a800"/>
    <circle cx="700" cy="160" r="6" fill="#2f6fde"/>
  </g>
  <!-- modules -->
  <rect x="325" y="270" width="170" height="80" rx="6" fill="#2457a6"/>
  <rect x="555" y="270" width="170" height="80" rx="6" fill="#6b3fa0"/>
  <g fill="#ffffff" font-size="11" text-anchor="middle">
    <text x="350" y="288">VCC</text><text x="390" y="288">GND</text><text x="430" y="288">SCL</text><text x="470" y="288">SDA</text>
    <text x="580" y="288">VCC</text><text x="620" y="288">GND</text><text x="660" y="288">SCL</text><text x="700" y="288">SDA</text>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="410" y="318" font-size="15" font-weight="700">MPU-6050</text>
    <text x="410" y="337" font-size="11">加速度・ジャイロ  0x68</text>
    <text x="640" y="318" font-size="15" font-weight="700">BMP280</text>
    <text x="640" y="337" font-size="11">気圧・温度  0x76 / 0x77</text>
  </g>
  <text x="30" y="368" fill="#555c66" font-size="12">● は接続点。線が交わっていても ● がなければつながっていない。</text>
  <text x="30" y="384" fill="#555c66" font-size="12">ピン名の並びはモジュールによって違うので、基板の印字で確認する。</text>
</svg>
