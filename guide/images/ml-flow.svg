<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
  <rect width="760" height="210" rx="10" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#667085"/>
    </marker>
  </defs>
  <g text-anchor="middle">
    <rect x="20" y="50" width="160" height="110" rx="10" fill="#e6f4ea" stroke="#1f7a3d" stroke-width="2"/>
    <text x="100" y="40" fill="#1f7a3d" font-weight="700" font-size="12">ピコ</text>
    <text x="100" y="88" font-weight="700" font-size="16" fill="#1d2330">① 集める</text>
    <text x="100" y="112" fill="#344054">加速度を2秒ごとに</text>
    <text x="100" y="130" fill="#344054">特徴量にまとめ</text>
    <text x="100" y="148" fill="#344054">ラベル付きで保存</text>

    <rect x="210" y="50" width="160" height="110" rx="10" fill="#e8effc" stroke="#2f6fde" stroke-width="2"/>
    <text x="290" y="40" fill="#2f6fde" font-weight="700" font-size="12">PC</text>
    <text x="290" y="88" font-weight="700" font-size="16" fill="#1d2330">② 学習する</text>
    <text x="290" y="112" fill="#344054">scikit-learn で</text>
    <text x="290" y="130" fill="#344054">決定木を作る</text>
    <text x="290" y="148" fill="#344054">正解率を確認</text>

    <rect x="400" y="50" width="160" height="110" rx="10" fill="#e8effc" stroke="#2f6fde" stroke-width="2"/>
    <text x="480" y="40" fill="#2f6fde" font-weight="700" font-size="12">PC</text>
    <text x="480" y="88" font-weight="700" font-size="16" fill="#1d2330">③ 変換する</text>
    <text x="480" y="112" fill="#344054">決定木を</text>
    <text x="480" y="130" fill="#344054">if 文の model.py に</text>
    <text x="480" y="148" fill="#344054">書き出す</text>

    <rect x="590" y="50" width="150" height="110" rx="10" fill="#e6f4ea" stroke="#1f7a3d" stroke-width="2"/>
    <text x="665" y="40" fill="#1f7a3d" font-weight="700" font-size="12">ピコ</text>
    <text x="665" y="88" font-weight="700" font-size="16" fill="#1d2330">④ 推論する</text>
    <text x="665" y="112" fill="#344054">センサーの値から</text>
    <text x="665" y="130" fill="#344054">その場で行動を</text>
    <text x="665" y="148" fill="#344054">判定する</text>
  </g>
  <g stroke="#667085" stroke-width="2" marker-end="url(#arr)">
    <line x1="182" y1="105" x2="206" y2="105"/>
    <line x1="372" y1="105" x2="396" y2="105"/>
    <line x1="562" y1="105" x2="586" y2="105"/>
  </g>
  <text x="380" y="192" text-anchor="middle" fill="#555c66" font-size="12">features.csv を PC にコピー → 学習 → model.py をピコに保存</text>
</svg>
