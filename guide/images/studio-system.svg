<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-1f7a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a3d"/></marker><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker></defs>
<rect width="760" height="250" rx="10" fill="#ffffff"/>
<text x="380" y="30" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">Pico Studio のしくみ</text>
<rect x="20" y="60" width="170" height="100" rx="8" fill="#eef4ff" stroke="#2f6fde" stroke-width="2"/>
<text x="105.0" y="96.8" font-size="14" text-anchor="middle" font-weight="700" fill="#2b2f36">ブラウザ</text>
<text x="105.0" y="117.7" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">画面を表示する</text>
<text x="105.0" y="135.1" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">ボタン・コードの入力</text>
<rect x="295" y="60" width="170" height="100" rx="8" fill="#fff6e0" stroke="#e0a800" stroke-width="2"/>
<text x="380.0" y="96.8" font-size="14" text-anchor="middle" font-weight="700" fill="#2b2f36">Pico Studio</text>
<text x="380.0" y="117.7" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">server.py（PC で動く）</text>
<text x="380.0" y="135.1" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">ピコとのやり取りを担当</text>
<rect x="570" y="60" width="170" height="100" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="655.0" y="96.8" font-size="14" text-anchor="middle" font-weight="700" fill="#2b2f36">ピコ</text>
<text x="655.0" y="117.7" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">MicroPython が動く</text>
<text x="655.0" y="135.1" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">コードを実行する</text>
<line x1="194" y1="110" x2="290" y2="110" stroke="#2f6fde" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-2f6fde)"/>
<line x1="290" y1="122" x2="194" y2="122" stroke="#2f6fde" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-2f6fde)"/>
<text x="242" y="98" font-size="11" text-anchor="middle" font-weight="400" fill="#2f6fde">localhost:8765</text>
<line x1="469" y1="110" x2="565" y2="110" stroke="#1f7a3d" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-1f7a3d)"/>
<line x1="565" y1="122" x2="469" y2="122" stroke="#1f7a3d" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-1f7a3d)"/>
<text x="517" y="98" font-size="11" text-anchor="middle" font-weight="700" fill="#1f7a3d">USB</text>
<text x="517" y="142" font-size="10" text-anchor="middle" font-weight="400" fill="#1f7a3d">/dev/ttyACM0</text>
<text x="30" y="195" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">① ターミナルで ./start.sh を打つと、PC の中で Pico Studio が動き出す</text>
<text x="30" y="215" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">② ブラウザで http://localhost:8765 を開くと、Pico Studio の画面が出る</text>
<text x="30" y="235" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">③ 画面で「接続」を押すと、USB でつながったピコと文字のやり取りが始まる</text>
</svg>
