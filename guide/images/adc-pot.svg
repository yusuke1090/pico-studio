<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs></defs>
<rect width="760" height="270" rx="10" fill="#ffffff"/>
<text x="380" y="26" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">ボリューム（可変抵抗）をアナログ入力で読む</text>
<rect x="40" y="90" width="200" height="60" rx="6" fill="#2457a6"/>
<circle cx="140" cy="80" r="28" fill="#cfd3da" stroke="#8a919c" stroke-width="2"/>
<line x1="140" y1="80" x2="156" y2="60" stroke="#2b2f36" stroke-width="4" stroke-linecap="round"/>
<text x="140" y="132" font-size="12" text-anchor="middle" font-weight="700" fill="#ffffff">ボリューム</text>
<line x1="70" y1="150" x2="70" y2="182" stroke="#8a919c" stroke-width="4" stroke-linecap="round"/>
<text x="70" y="200" font-size="11" text-anchor="middle" font-weight="700" fill="#d93a3a">3V3(OUT)</text>
<text x="70" y="215" font-size="11" text-anchor="middle" font-weight="400" fill="#d93a3a">36番</text>
<line x1="140" y1="150" x2="140" y2="182" stroke="#8a919c" stroke-width="4" stroke-linecap="round"/>
<text x="140" y="200" font-size="11" text-anchor="middle" font-weight="700" fill="#6b3fa0">GP26</text>
<text x="140" y="215" font-size="11" text-anchor="middle" font-weight="400" fill="#6b3fa0">ADC0・31番</text>
<line x1="210" y1="150" x2="210" y2="182" stroke="#8a919c" stroke-width="4" stroke-linecap="round"/>
<text x="210" y="200" font-size="11" text-anchor="middle" font-weight="700" fill="#2b2f36">GND</text>
<text x="210" y="215" font-size="11" text-anchor="middle" font-weight="400" fill="#2b2f36">33番</text>
<text x="470" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#2b2f36">つまみを回すと、真ん中の足の電圧が変わる</text>
<defs><linearGradient id="g1"><stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#d93a3a"/></linearGradient></defs>
<rect x="300" y="90" width="400" height="24" rx="6" fill="url(#g1)"/>
<line x1="300" y1="116" x2="300" y2="124" stroke="#2b2f36" stroke-width="2" stroke-linecap="round"/>
<text x="300" y="140" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">0</text>
<text x="300" y="156" font-size="12" text-anchor="middle" font-weight="400" fill="#2b2f36">0V</text>
<line x1="500" y1="116" x2="500" y2="124" stroke="#2b2f36" stroke-width="2" stroke-linecap="round"/>
<text x="500" y="140" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">約 32768</text>
<text x="500" y="156" font-size="12" text-anchor="middle" font-weight="400" fill="#2b2f36">約 1.65V</text>
<line x1="700" y1="116" x2="700" y2="124" stroke="#2b2f36" stroke-width="2" stroke-linecap="round"/>
<text x="700" y="140" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">65535</text>
<text x="700" y="156" font-size="12" text-anchor="middle" font-weight="400" fill="#2b2f36">3.3V</text>
<text x="500" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">read_u16() の値</text>
<text x="500" y="214" font-size="13" text-anchor="middle" font-weight="700" fill="#6b3fa0">電圧 = 値 × 3.3 ÷ 65535</text>
<text x="30" y="252" font-size="12" text-anchor="start" font-weight="400" fill="#555c66">アナログ入力に使えるのは GP26・GP27・GP28 の3本だけです。3.3V より高い電圧は入れないでください。</text>
</svg>
