<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker><marker id="ah-e07b00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e07b00"/></marker></defs>
<rect width="760" height="340" rx="10" fill="#ffffff"/>
<text x="380" y="26" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">レジスタの読み書き（MPU-6050 の例）</text>
<rect x="20" y="60" width="140" height="220" rx="8" fill="#1f7a3d"/>
<text x="90" y="170" font-size="18" text-anchor="middle" font-weight="700" fill="#ffffff">ピコ</text>
<rect x="430" y="46" width="310" height="262" rx="8" fill="#2457a6"/>
<text x="585" y="68" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">MPU-6050（アドレス 0x68）</text>
<rect x="442" y="80" width="286" height="26" rx="4" fill="#ffffff"/>
<text x="450" y="98" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x1B</text>
<text x="522" y="98" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">GYRO_CONFIG</text>
<text x="720" y="98" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">ジャイロの範囲</text>
<rect x="442" y="110" width="286" height="26" rx="4" fill="#ffffff"/>
<text x="450" y="128" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x1C</text>
<text x="522" y="128" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">ACCEL_CONFIG</text>
<text x="720" y="128" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">加速度の範囲</text>
<rect x="442" y="140" width="286" height="26" rx="4" fill="#d6e6ff"/>
<text x="450" y="158" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x3B〜40</text>
<text x="522" y="158" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">ACCEL X/Y/Z</text>
<text x="720" y="158" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">加速度（6バイト）</text>
<rect x="442" y="170" width="286" height="26" rx="4" fill="#d6e6ff"/>
<text x="450" y="188" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x41〜42</text>
<text x="522" y="188" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">TEMP</text>
<text x="720" y="188" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">温度（2バイト）</text>
<rect x="442" y="200" width="286" height="26" rx="4" fill="#d6e6ff"/>
<text x="450" y="218" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x43〜48</text>
<text x="522" y="218" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">GYRO X/Y/Z</text>
<text x="720" y="218" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">角速度（6バイト）</text>
<rect x="442" y="230" width="286" height="26" rx="4" fill="#ffe2bf"/>
<text x="450" y="248" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x6B</text>
<text x="522" y="248" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">PWR_MGMT_1</text>
<text x="720" y="248" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">0 を書くと起きる</text>
<rect x="442" y="260" width="286" height="26" rx="4" fill="#ffffff"/>
<text x="450" y="278" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">0x75</text>
<text x="522" y="278" font-size="11" text-anchor="start" font-weight="700" fill="#2b2f36">WHO_AM_I</text>
<text x="720" y="278" font-size="11" text-anchor="end" font-weight="400" fill="#555c66">0x68 が入っている</text>
<line x1="162" y1="243" x2="438" y2="243" stroke="#e07b00" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-e07b00)"/>
<text x="295" y="232" font-size="10.5" text-anchor="middle" font-weight="700" fill="#e07b00" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">書く: i2c.writeto_mem(0x68, 0x6B, b&quot;\x00&quot;)</text>
<line x1="438" y1="185" x2="162" y2="185" stroke="#2f6fde" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-2f6fde)"/>
<text x="300" y="174" font-size="11" text-anchor="middle" font-weight="700" fill="#2f6fde" font-family="ui-monospace, 'DejaVu Sans Mono', monospace">読む: i2c.readfrom_mem(0x68, 0x3B, 14)</text>
<text x="300" y="204" font-size="11" text-anchor="middle" font-weight="400" fill="#2f6fde">0x3B から 14バイト まとめて読む</text>
<text x="20" y="330" font-size="12" text-anchor="start" font-weight="400" fill="#555c66">レジスタは、センサーの中に並んだ番号付きの小さな記憶場所。設定を書き込んだり、測った値を読み出したりする。</text>
</svg>
