<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs></defs>
<rect width="760" height="320" rx="10" fill="#ffffff"/>
<text x="20" y="30" font-size="15" text-anchor="start" font-weight="700" fill="#1f7a3d">押していないとき → 1</text>
<rect x="20" y="50" width="180" height="210" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="30" y="252" font-size="11" text-anchor="start" font-weight="400" fill="#555c66">ピコの中</text>
<text x="100" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#d93a3a">3.3V</text>
<line x1="100" y1="78" x2="100" y2="95" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<path d="M100 95 l-10 6 l20 12 l-20 12 l20 12 l-10 6" stroke="#2b2f36" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="116" y="124" font-size="11" text-anchor="start" font-weight="400" fill="#555c66">抵抗</text>
<line x1="100" y1="143" x2="100" y2="170" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="100" cy="170" r="4.5" fill="#2b2f36"/>
<line x1="100" y1="170" x2="200" y2="170" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="200" cy="170" r="6" fill="#e0a800"/>
<text x="200" y="158" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">GP24</text>
<text x="60" y="215" font-size="20" text-anchor="middle" font-weight="700" fill="#1f7a3d">値 = 1</text>
<line x1="206" y1="170" x2="270" y2="170" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="270" cy="172" r="4" fill="#2b2f36"/>
<circle cx="270" cy="218" r="4" fill="#2b2f36"/>
<line x1="270" y1="214" x2="296" y2="184" stroke="#2b2f36" stroke-width="3" stroke-linecap="round"/>
<text x="300" y="204" font-size="12" text-anchor="start" font-weight="700" fill="#2b2f36">ボタン</text>
<line x1="270" y1="222" x2="270" y2="245" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<line x1="255.0" y1="245" x2="285.0" y2="245" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<line x1="260.0" y1="251" x2="280.0" y2="251" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<line x1="265.0" y1="257" x2="275.0" y2="257" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<text x="300" y="258" font-size="12" text-anchor="start" font-weight="700" fill="#2b2f36">GND</text>
<text x="410" y="30" font-size="15" text-anchor="start" font-weight="700" fill="#e07b00">ボタンを押したとき → 0</text>
<rect x="410" y="50" width="180" height="210" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="420" y="252" font-size="11" text-anchor="start" font-weight="400" fill="#555c66">ピコの中</text>
<text x="490" y="72" font-size="13" text-anchor="middle" font-weight="700" fill="#d93a3a">3.3V</text>
<line x1="490" y1="78" x2="490" y2="95" stroke="#e07b00" stroke-width="2.5" stroke-linecap="round"/>
<path d="M490 95 l-10 6 l20 12 l-20 12 l20 12 l-10 6" stroke="#e07b00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="506" y="124" font-size="11" text-anchor="start" font-weight="400" fill="#555c66">抵抗</text>
<line x1="490" y1="143" x2="490" y2="170" stroke="#e07b00" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="490" cy="170" r="4.5" fill="#e07b00"/>
<line x1="490" y1="170" x2="590" y2="170" stroke="#e07b00" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="590" cy="170" r="6" fill="#e0a800"/>
<text x="590" y="158" font-size="12" text-anchor="middle" font-weight="700" fill="#2b2f36">GP24</text>
<text x="450" y="215" font-size="20" text-anchor="middle" font-weight="700" fill="#e07b00">値 = 0</text>
<line x1="596" y1="170" x2="660" y2="170" stroke="#e07b00" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="660" cy="172" r="4" fill="#e07b00"/>
<circle cx="660" cy="218" r="4" fill="#e07b00"/>
<line x1="660" y1="176" x2="660" y2="214" stroke="#e07b00" stroke-width="4" stroke-linecap="round"/>
<text x="690" y="204" font-size="12" text-anchor="start" font-weight="700" fill="#2b2f36">ボタン</text>
<line x1="660" y1="222" x2="660" y2="245" stroke="#e07b00" stroke-width="2.5" stroke-linecap="round"/>
<line x1="645.0" y1="245" x2="675.0" y2="245" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<line x1="650.0" y1="251" x2="670.0" y2="251" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<line x1="655.0" y1="257" x2="665.0" y2="257" stroke="#2b2f36" stroke-width="2.5" stroke-linecap="round"/>
<text x="690" y="258" font-size="12" text-anchor="start" font-weight="700" fill="#2b2f36">GND</text>
<text x="20" y="290" font-size="12.5" text-anchor="start" font-weight="400" fill="#555c66">Pin(24, Pin.IN, Pin.PULL_UP)：ピコの中の抵抗が 3.3V に引っぱるので、ふだんは 1。</text>
<text x="20" y="309" font-size="12.5" text-anchor="start" font-weight="400" fill="#555c66">ボタンを押すと GND（0V）とつながって 0 になる。抵抗がないと、押していないときの値がふらつく。</text>
</svg>
