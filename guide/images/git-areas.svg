<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker><marker id="ah-6b3fa0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fa0"/></marker></defs>
<rect width="820" height="320" rx="10" fill="#ffffff"/>
<text x="410.0" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">git でファイルが通る場所</text>
<rect x="20" y="55" width="142" height="125" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="91.0" y="78" font-size="14" text-anchor="middle" font-weight="700" fill="#555c66">① 作業フォルダ</text>
<text x="91.0" y="100" font-size="12" text-anchor="middle" fill="#555c66">~/apps/collar</text>
<text x="91.0" y="118" font-size="12" text-anchor="middle" fill="#555c66">ふだん書き換える</text>
<text x="91.0" y="136" font-size="12" text-anchor="middle" fill="#555c66">ファイル</text>
<rect x="232" y="55" width="142" height="125" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="303.0" y="78" font-size="14" text-anchor="middle" font-weight="700" fill="#c28a00">② ステージ</text>
<text x="303.0" y="100" font-size="12" text-anchor="middle" fill="#555c66">次のコミットに</text>
<text x="303.0" y="118" font-size="12" text-anchor="middle" fill="#555c66">入れる変更を</text>
<text x="303.0" y="136" font-size="12" text-anchor="middle" fill="#555c66">選んでおく所</text>
<rect x="444" y="55" width="142" height="125" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="515.0" y="78" font-size="14" text-anchor="middle" font-weight="700" fill="#1f7a3d">③ 手元の記録</text>
<text x="515.0" y="100" font-size="12" text-anchor="middle" fill="#555c66">.git フォルダ</text>
<text x="515.0" y="118" font-size="12" text-anchor="middle" fill="#555c66">コミットの歴史</text>
<text x="515.0" y="136" font-size="12" text-anchor="middle" fill="#555c66">PC の中だけ</text>
<rect x="656" y="55" width="142" height="125" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="727.0" y="78" font-size="14" text-anchor="middle" font-weight="700" fill="#6b3fa0">④ GitHub</text>
<text x="727.0" y="100" font-size="12" text-anchor="middle" fill="#555c66">リモート（origin）</text>
<text x="727.0" y="118" font-size="12" text-anchor="middle" fill="#555c66">別の PC・ラズパイと</text>
<text x="727.0" y="136" font-size="12" text-anchor="middle" fill="#555c66">共有する</text>
<path d="M162 105 L230 105" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="197" y="97" font-size="11" text-anchor="middle" font-weight="700" fill="#2f6fde">git add</text>
<text x="197" y="121" font-size="10" text-anchor="middle" fill="#555c66">＋（Stage）</text>
<path d="M374 105 L442 105" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="409" y="97" font-size="11" text-anchor="middle" font-weight="700" fill="#2f6fde">git commit</text>
<text x="409" y="121" font-size="10" text-anchor="middle" fill="#555c66">Commit</text>
<path d="M586 105 L654 105" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="621" y="97" font-size="11" text-anchor="middle" font-weight="700" fill="#2f6fde">git push</text>
<text x="621" y="121" font-size="10" text-anchor="middle" fill="#555c66">Sync Changes</text>
<path d="M727 180 L727 212 L91 212 L91 184" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-6b3fa0)"/>
<text x="409" y="234" font-size="12" text-anchor="middle" font-weight="700" fill="#6b3fa0">git clone（最初の1回）・git pull（ふだん）: GitHub の記録を、手元と作業フォルダに持ってくる</text>
<text x="409" y="270" font-size="12" text-anchor="middle" fill="#555c66">① → ③ は PC の中だけで、インターネットは要らない。④ に送るのは git push のときだけ</text>
<text x="409" y="292" font-size="12" text-anchor="middle" fill="#555c66">矢印の下は VS Code のソース管理のボタン。どのファイルがどこにあるかは git status でわかる</text>
</svg>
