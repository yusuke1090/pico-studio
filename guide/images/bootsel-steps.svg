<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-8a919c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a919c"/></marker></defs>
<rect width="760" height="340" rx="10" fill="#ffffff"/>
<text x="20" y="26" font-size="14" text-anchor="start" font-weight="700" fill="#2b2f36">方法A：USB を抜き差しする（どのボードでも使える）</text>
<rect x="20" y="40" width="160" height="96" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="2"/>
<circle cx="42" cy="62" r="13" fill="#e07b00"/>
<text x="42" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<text x="62" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">BOOT を</text>
<text x="62" y="84" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">押したまま</text>
<rect x="32" y="104" width="70" height="22" rx="11" fill="#e07b00"/>
<text x="67.0" y="119" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff">BOOT 押す</text>
<line x1="182" y1="88" x2="196" y2="88" stroke="#8a919c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="200" y="40" width="160" height="96" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="2"/>
<circle cx="222" cy="62" r="13" fill="#e07b00"/>
<text x="222" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="242" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">USB を</text>
<text x="242" y="84" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">PC につなぐ</text>
<rect x="212" y="104" width="70" height="22" rx="11" fill="#e07b00"/>
<text x="247.0" y="119" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff">BOOT 押す</text>
<rect x="288" y="104" width="38" height="22" rx="11" fill="#e07b00"/>
<text x="307.0" y="119" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff">USB</text>
<line x1="362" y1="88" x2="376" y2="88" stroke="#8a919c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="380" y="40" width="160" height="96" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="2"/>
<circle cx="402" cy="62" r="13" fill="#e07b00"/>
<text x="402" y="67" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<text x="422" y="66" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">BOOT を</text>
<text x="422" y="84" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">離す</text>
<rect x="392" y="104" width="70" height="22" rx="11" fill="#d4d8de"/>
<text x="427.0" y="119" font-size="11" text-anchor="middle" font-weight="700" fill="#555c66">BOOT 離す</text>
<line x1="542" y1="88" x2="556" y2="88" stroke="#8a919c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="560" y="40" width="180" height="96" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="650.0" y="66.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f7a3d">成功</text>
<text x="650.0" y="87.9" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">PC に「RPI-RP2」が出る</text>
<text x="650.0" y="105.2" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">Pico Studio に</text>
<text x="650.0" y="122.6" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">「BOOTSEL モード」</text>
<text x="20" y="176" font-size="14" text-anchor="start" font-weight="700" fill="#2b2f36">方法B：USB を抜かずに（RST ボタンがあるボード）</text>
<rect x="20" y="190" width="160" height="96" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="2"/>
<circle cx="42" cy="212" r="13" fill="#e07b00"/>
<text x="42" y="217" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">1</text>
<text x="62" y="216" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">BOOT を</text>
<text x="62" y="234" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">押したまま</text>
<rect x="32" y="254" width="70" height="22" rx="11" fill="#e07b00"/>
<text x="67.0" y="269" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff">BOOT 押す</text>
<line x1="182" y1="238" x2="196" y2="238" stroke="#8a919c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="200" y="190" width="160" height="96" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="2"/>
<circle cx="222" cy="212" r="13" fill="#e07b00"/>
<text x="222" y="217" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">2</text>
<text x="242" y="216" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">RST を押して</text>
<text x="242" y="234" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">すぐ離す</text>
<rect x="212" y="254" width="70" height="22" rx="11" fill="#e07b00"/>
<text x="247.0" y="269" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff">BOOT 押す</text>
<rect x="288" y="254" width="38" height="22" rx="11" fill="#e07b00"/>
<text x="307.0" y="269" font-size="11" text-anchor="middle" font-weight="700" fill="#ffffff">RST</text>
<line x1="362" y1="238" x2="376" y2="238" stroke="#8a919c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="380" y="190" width="160" height="96" rx="8" fill="#f4f6f8" stroke="#8a919c" stroke-width="2"/>
<circle cx="402" cy="212" r="13" fill="#e07b00"/>
<text x="402" y="217" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">3</text>
<text x="422" y="216" font-size="13" text-anchor="start" font-weight="700" fill="#2b2f36">BOOT を</text>
<text x="422" y="234" font-size="13" text-anchor="start" font-weight="400" fill="#2b2f36">離す</text>
<rect x="392" y="254" width="70" height="22" rx="11" fill="#d4d8de"/>
<text x="427.0" y="269" font-size="11" text-anchor="middle" font-weight="700" fill="#555c66">BOOT 離す</text>
<line x1="542" y1="238" x2="556" y2="238" stroke="#8a919c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah-8a919c)"/>
<rect x="560" y="190" width="180" height="96" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="650.0" y="216.4" font-size="15" text-anchor="middle" font-weight="700" fill="#1f7a3d">成功</text>
<text x="650.0" y="237.9" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">PC に「RPI-RP2」が出る</text>
<text x="650.0" y="255.2" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">Pico Studio に</text>
<text x="650.0" y="272.7" font-size="12" text-anchor="middle" font-weight="400" fill="#555c66">「BOOTSEL モード」</text>
<text x="20" y="328" font-size="12" text-anchor="start" font-weight="400" fill="#555c66">書き込みモードでは、ピコは USB メモリのように見えます。保存したファイルは消えません。</text>
</svg>
