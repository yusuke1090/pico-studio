<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="system-ui, 'Noto Sans JP', sans-serif" font-size="13">
<defs><marker id="ah-1f7a3d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f7a3d"/></marker><marker id="ah-555c66" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#555c66"/></marker><marker id="ah-c28a00" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c28a00"/></marker><marker id="ah-6b3fa0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6b3fa0"/></marker><marker id="ah-2f6fde" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fde"/></marker><marker id="ah-c0392b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker></defs>
<rect width="820" height="400" rx="10" fill="#ffffff"/>
<text x="410.0" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">VS Code で C++ を開発するときのしくみ</text>
<rect x="20" y="60" width="230" height="150" rx="8" fill="#e8f0fd" stroke="#2f6fde" stroke-width="2"/>
<text x="135.0" y="82" font-size="14" text-anchor="middle" font-weight="700" fill="#2f6fde">VS Code</text>
<text x="135.0" y="104" font-size="12" text-anchor="middle" fill="#555c66">コードを書く・補完・エラー表示</text>
<text x="135.0" y="122" font-size="12" text-anchor="middle" fill="#555c66"></text>
<text x="135.0" y="140" font-size="12" text-anchor="middle" fill="#555c66">拡張機能「Raspberry Pi Pico」</text>
<text x="135.0" y="158" font-size="12" text-anchor="middle" fill="#555c66">ボタンでビルド・書き込み・デバッグ</text>
<rect x="20" y="240" width="230" height="140" rx="8" fill="#fff6e0" stroke="#c28a00" stroke-width="2"/>
<text x="32" y="262" font-size="14" text-anchor="start" font-weight="700" fill="#c28a00">プロジェクト ~/apps/collar</text>
<text x="32" y="284" font-size="12" text-anchor="start" fill="#555c66">CMakeLists.txt（ビルドの設定）</text>
<text x="32" y="302" font-size="12" text-anchor="start" fill="#555c66">collar.cpp（自分のプログラム）</text>
<text x="32" y="320" font-size="12" text-anchor="start" fill="#555c66">.vscode/（拡張機能の設定）</text>
<text x="32" y="338" font-size="12" text-anchor="start" fill="#555c66">build/collar.uf2（できたもの）</text>
<rect x="300" y="60" width="230" height="170" rx="8" fill="#f1ebf8" stroke="#6b3fa0" stroke-width="2"/>
<text x="312" y="82" font-size="14" text-anchor="start" font-weight="700" fill="#6b3fa0">~/.pico-sdk（自動で入る）</text>
<text x="312" y="104" font-size="12" text-anchor="start" fill="#555c66">Pico SDK</text>
<text x="312" y="122" font-size="12" text-anchor="start" fill="#555c66">ARM 用のコンパイラ</text>
<text x="312" y="140" font-size="12" text-anchor="start" fill="#555c66">CMake・Ninja（ビルドの道具）</text>
<text x="312" y="158" font-size="12" text-anchor="start" fill="#555c66">picotool（USB で書き込む）</text>
<text x="312" y="176" font-size="12" text-anchor="start" fill="#555c66">OpenOCD（デバッグ用）</text>
<rect x="620" y="60" width="180" height="110" rx="8" fill="#e7f4ec" stroke="#1f7a3d" stroke-width="2"/>
<text x="710.0" y="82" font-size="14" text-anchor="middle" font-weight="700" fill="#1f7a3d">ピコ</text>
<text x="710.0" y="104" font-size="12" text-anchor="middle" fill="#555c66">USB で書き込み</text>
<text x="710.0" y="122" font-size="12" text-anchor="middle" fill="#555c66">printf の出力</text>
<rect x="620" y="240" width="180" height="110" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="710.0" y="262" font-size="14" text-anchor="middle" font-weight="700" fill="#555c66">Debug Probe（あれば）</text>
<text x="710.0" y="284" font-size="12" text-anchor="middle" fill="#555c66">SWD の3本の線で</text>
<text x="710.0" y="302" font-size="12" text-anchor="middle" fill="#555c66">ピコにつなぐ</text>
<text x="710.0" y="320" font-size="12" text-anchor="middle" fill="#555c66">行で止めて調べる</text>
<path d="M250 135 L298 135" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="274" y="128" font-size="11" text-anchor="middle" fill="#2f6fde">使う</text>
<path d="M135 210 L135 238" fill="none" stroke="#2f6fde" stroke-width="2" marker-end="url(#ah-2f6fde)"/>
<text x="190" y="228" font-size="11" text-anchor="middle" fill="#2f6fde">作る・ビルド</text>
<path d="M530 125 L618 125" fill="none" stroke="#1f7a3d" stroke-width="2" marker-end="url(#ah-1f7a3d)"/>
<text x="574" y="105" font-size="11" text-anchor="middle" fill="#1f7a3d">Run Project</text>
<text x="574" y="119" font-size="11" text-anchor="middle" fill="#1f7a3d">(USB)</text>
<path d="M530 200 L618 290" fill="none" stroke="#6b3fa0" stroke-width="2" marker-end="url(#ah-6b3fa0)"/>
<text x="552" y="252" font-size="11" text-anchor="end" fill="#6b3fa0">Debug /</text>
<text x="566" y="268" font-size="11" text-anchor="end" fill="#6b3fa0">Flash (SWD)</text>
<path d="M710 240 L710 172" fill="none" stroke="#555c66" stroke-width="2" marker-end="url(#ah-555c66)"/>
<text x="732" y="210" font-size="11" text-anchor="middle" fill="#555c66">SWD</text>
<text x="415" y="300" font-size="11" text-anchor="middle" fill="#555c66">今の ~/pico/pico-sdk（Pico Studio 用）とは</text>
<text x="415" y="316" font-size="11" text-anchor="middle" fill="#555c66">別に、拡張機能が自分用にもう1組入れる</text>
</svg>
