<text x="210.5" y="72" font-size="12" text-anchor="middle" font-weight="700" fill="#2f6fde">② プロジェクトを作る</text>
<text x="210.5" y="94" font-size="11" text-anchor="middle" fill="#555c66">New C/C++ Project</text>
