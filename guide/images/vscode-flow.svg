<rect width="820" height="210" rx="10" fill="#ffffff"/>
<text x="410.0" y="28" font-size="16" text-anchor="middle" font-weight="700" fill="#2b2f36">VS Code での開発の流れ</text>
<rect x="20" y="50" width="115" height="80" rx="8" fill="#f3f4f6" stroke="#555c66" stroke-width="2"/>
<text x="77.5" y="72" font-size="12" text-anchor="middle" font-weight="700" fill="#555c66">① 拡張機能を入れる</text>
